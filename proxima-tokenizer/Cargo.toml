[package]
name = "proxima-tokenizer"
description = "Sans-IO byte-level BPE tokenizer: encode/decode over a caller-supplied vocab (built directly, or parsed from proxima-gguf metadata), no IO in the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std"]
alloc = []
# runtime config surface (`config::TokenizerConfig`): conflaguration is
# std-only, so it rides in only here -- the no_std+alloc floor never sees
# it and always uses `crate::sized` directly.
std = ["alloc", "thiserror/std", "dep:bon", "dep:conflaguration", "dep:serde"]
# builds a `Vocab` directly from a parsed GGUF metadata region -- optional
# so the tokenizer core has no hard dependency on the gguf reader. Pulls
# `std` (this crate's own, and proxima-gguf's `edge::read_file`
# convenience) because the only place this crate exercises the
# combination end to end is the real-fixture test, which needs a file
# read.
gguf = ["std", "dep:proxima-gguf", "proxima-gguf/std"]

[dependencies]
proxima-primitives = { workspace = true, default-features = false }
thiserror.workspace = true
bon = { workspace = true, optional = true }
conflaguration = { workspace = true, features = ["derive", "toml"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
proxima-gguf = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
temp-env.workspace = true
