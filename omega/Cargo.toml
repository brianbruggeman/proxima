[package]
name = "omega"
description = "MSL kernel emission from the proxima-tensor Nest descriptor — the emit half of the GPU backend; the device driver composes on top"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
# `metal` is default because the objc2 deps live in a macOS target section, so
# a non-darwin build never resolves them. It was default-off, which meant the
# 13 `metal_parity` cases compiled to zero on an ordinary test run — and
# nextest's "0 skipped" reads exactly like "everything passed". They sat
# broken and uncompiled behind that flag.
default = ["std", "metal", "cpu"]
std = ["alloc", "thiserror/std", "proxima-tensor/std"]
alloc = []
cached-attention-streaming = ["proxima-tensor/cached-attention-streaming"]
# Backends are MIX-AND-MATCH, the same shape `runtime-prime` and
# `runtime-tokio` take at the workspace root (`Cargo.toml`): both may be
# compiled in at once and the choice made at runtime, rather than one
# excluding the other. That is what lets one binary measure CPU against
# Metal on the same program and the same blocks — the comparison this whole
# backend exists to win.
#
# `cpu` is the `proxima_tensor::cpu` evaluator reached through omega's own
# entry points, so a caller depends on omega alone and never on a specific
# backend crate.
cpu = ["std", "proxima-tensor/std"]
# Runtime Metal execution driver (src/metal.rs, macOS-only via
# `target_os = "macos"` on the module itself). `proxima-tensor/std` is turned
# on here because the parity test binary links proxima-tensor's
# `cpu::evaluate` as its oracle — the driver's own prepare pipeline
# (infer/annotate/lower) is alloc-tier already and needs no such thing.
# winners of the 2026-09-04 sweep 3 arm B1 (43.052 ms/token, CoV 0.56%,
# 2.443x vs llama.cpp; op_count 938; text identical): `metal-output-placement`
# and `metal-wide-cooperative-reduce` fold in here too, so `cargo nextest run
# -p omega --features metal` exercises the same default decode path as
# proxima-model-interop's `metal` feature.
# The paired-nibble/paired-lane decode body (`msl.rs`'s `q4k_pair_dot`/
# `q5k_pair_dot`/`q6k_pair_dot`) is selected for `Q4_K`/`Q5_K`/`Q6_K` by
# `PackedCodec::supports_pair_dot` -- a structural fact of each codec's block
# layout -- whenever the reduce is a plain `Float32` product, not by a
# cargo feature (the former `metal-q5k-pair-dot`/`metal-q6k-pair-dot`
# feature flags this comment used to name here). `Q5_K`'s body measured
# 202,083 ns/op -> 124,265 ns/op (1.63x) on the 8 Q5_K ops in the real
# `blk.{0..3}.ffn_down.weight` family (6.275 -> 5.725 ms), decode wall flat
# within noise (41.32/41.63/42.01 vs 41.35/41.15/41.32 ms over 3 rounds),
# text identical, parity < 1e-4 against the scalar oracle -- see
# `proxima-tensor/docs/discipline.md` ROW 278 for the full table this
# structural landing folded `Q6_K` into as well.
# `metal-plan-stable-buffers` joins them per CARD 6.5: a plan-owned
# `BufferArena` (whole buffers, liveness-partitioned, outputs pinned) plus
# `PlanUniforms` (one uniform buffer per plan position) turn a plan-cache hit
# from 842 allocations/step into 0; op_setup fell 3.94-5.42 -> 0.39-0.60
# ms/step, arena peak 13,967,368 B at prefill vs a naive 370,941,308 B
# (26.56x reuse), steady-state peak 450,568 B, text identical. Wall clock on
# a noisy box: OFF [40.2, 69.9] ms/token, ON [37.7, 44.3] ms/token, ON <= OFF
# every round. This also makes `backend::Plan::Metal`'s `Box` (added to keep
# clippy::large_enum_variant clean once `metal::Plan` carries the arena and
# uniform state) part of the default build; no other public signature moves.
# `cached-attention-streaming` joins per the owner's less-work rule (ROW 282):
# ROW 281's bake-off found no confirmed wall win (delta 0.07% of the OFF mean,
# inside both arms' CoV) but a real, measured reduction in work -- emit_calls
# 938 -> 616 per decode step, GPU-side `total_gpu_ms` 35.266 -> 32.356
# (-8.2%), `device_allocated_bytes` -131,072 B -- with `generated_text`
# identical across all 3 bake-off rounds. The owner's rule: keep a
# less-work change when output is identical and wall clock is not worse
# beyond noise, even if wall clock does not visibly move.
# `metal-concurrent-dispatch` joins per ROW 285's bake-off: the serial
# encoder implies a barrier between every pair of dispatches; the
# `HazardTracker` emits `memoryBarrierWithScope(Buffers)` only at a genuine
# RAW/WAW/WAR hazard, 419 of 616 ops/step. `gpu_exec_ms` mean over 3
# interleaved rounds fell 29.267 -> 27.258 ms (beyond both arms' CoV,
# 0.84%/1.05%), wall mean 36.556 -> 34.725 ms (ON <= OFF + CoV every round),
# `device_allocated_bytes` unchanged, `generated_text` identical across all
# 3 bake-off rounds plus 3 extra determinism runs.
metal = [
    "std",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:half",
    "dep:proxima-telemetry",
    "proxima-telemetry/alloc",
    "dep:libc",
    "dep:block2",
    "proxima-tensor/std",
    "metal-output-placement",
    "metal-wide-cooperative-reduce",
    "metal-plan-stable-buffers",
    "cached-attention-streaming",
    "metal-concurrent-dispatch",
]
# `Vulkan`/`Npu`/`Ane` name-reservation features were deleted with the
# `Backend` variants they backed (design §B.4, 2026-09-04): no emitter and no
# driver ever existed behind any of the three, so there was nothing for a
# feature flag to gate.
#
# `src/cuda.rs`: a real, tested CUDA C kernel emitter over the same BoundOp
# descriptor `msl`/`wgsl` emit from (elementwise/reduce/scan, gather with an
# atomicOr fault buffer, all five packed codecs, a warp-shuffle cooperative
# reduce) — dependency-free, pure string generation, so it builds and its
# tests run on any host including this crate's macOS CI gate with no NVIDIA
# GPU present. `cuda` names no `Engine`/`GpuDriver` variant: this is the
# source EMITTER only, and has no DRIVER (no `cudarc`/`cust`, no
# `cuModuleLoad`/`cuLaunchKernel`), so nothing here can actually dispatch a
# kernel to a device — only emit the source a future driver would compile and
# launch. Needs `alloc`: `cuda.rs` is pure string generation (`String`/`Vec`/
# `format!`), the same alloc-tier shape `msl.rs` takes, and had no floor of
# its own before this -- `--no-default-features --features cuda` failed to
# resolve `alloc::string::String` until this line named the real dependency.
cuda = ["alloc"]
# Per-token wall-clock attribution for the Metal decode path (split-4019
# initiative): tick counters over prepare (infer+bind), MSL emit, pipeline
# cache hit/miss, block upload, per-op setup, GPU execute, and readback --
# mirroring the shape `proxima_tensor::instrument`'s own `MATMUL_Q4K_CALL_TICKS`
# already uses. Default-off and additive only: every wrap is
# `#[cfg(feature = "instrument")]`, so an instrument-off build never pays the
# `read_ticks()` call it would otherwise cost.
instrument = ["metal", "proxima-tensor/instrument"]
# `simdgroup_matrix`-tiled Q4_K GEMM path (`msl.rs`'s `push_tiled_gemm_body`),
# selected over the row-blocked packed path (`push_packed_row_blocked_body`)
# only above `sized::TILED_GEMM_MIN_TOKENS` activation rows -- see that
# const's own doc and `docs/discipline.md` ROW 107. Default-off: this is a
# second, riskier kernel (`proxima-tensor/docs/discipline.md` ROW 105's own
# framing) and does not earn the production default until an e2e bench shows
# the full stack wins with it on. Depends on `metal` (not just `std`): the
# eligibility gate and kernel body live in `msl.rs`, which is alloc-tier, but
# the const it reads only has meaning for a Metal dispatch.
metal-tiled-gemm = ["metal"]
# Mask-without-shift/branch-free Q4_K matvec body for the row-blocked packed
# path's SCALE-DEFERRED (`is_plain_product_reduce`) arm (`msl.rs`'s
# `push_q4k_header_decode`/`push_q4k_product_reduce_body`), porting ggml's
# ACTUAL `kernel_mul_mv_q4_K_f32_impl` technique (`ggml-metal.metal:5096-
# 5098,5157-5175`: mask four fixed bit positions off a `uint16_t` load, no
# shift at all, fold the 1x/16x/256x residual scale into the per-sub-block
# combine) onto this crate's one-nibble-per-byte lane layout, plus a
# branch-free port of `q4k_scale_min`'s `if (sub_block < 4u)` scale/min
# unpack. `msl.rs`'s own `q4k_run8` doc previously (incorrectly) claimed
# ggml did "the same thing one width down" -- it does not; that claim is
# corrected in-tree as part of this feature landing. Default-off per the
# same discipline as `metal-tiled-gemm` above -- a kernel-body rewrite earns
# the production default only after a quiet-box decode-step seal, not on the
# mechanism argument alone (see `docs/discipline.md`, row assigned
# centrally).
metal-q4k-mask-fma = ["metal"]
# Row-blocked packed-`Q4_K` matvec lane remap (`msl.rs`'s
# `push_q4k_single_fetch_body`): eliminates the redundant paired-lane load
# in `push_packed_row_blocked_body`'s default `Q4_K` lane assignment, where
# lanes `2r`/`2r+1` issue the SAME 32-byte `qs` load and differ only in
# which nibble half they keep. Default-off, same posture as
# `metal-tiled-gemm` above: a second, riskier lane-index scheme for the
# hottest decode kernel, and does not earn the production default until an
# e2e bench on the real decode graph shows it wins. Depends on `metal` for
# the same reason `metal-tiled-gemm` does: the codegen itself is alloc-tier
# `msl.rs`, but the alternate lane math only has meaning for a Metal
# dispatch. NOTE: `q4k_pair_dot`'s own `plain_product` arm (`DType::Float32`
# AND the scale-deferred shape) takes priority over
# this feature -- see `push_packed_row_blocked_body`'s own arm ordering --
# since `push_q4k_single_fetch_body` is a fully self-contained kernel body
# (its own dispatch loop, not routed through the shared lane-spread
# preamble/match), it is checked BEFORE `metal-q4k-mask-fma`'s masked header
# decode and wins over it whenever both are enabled: `metal-q4k-mask-fma`'s
# masked extraction has no effect on the single-fetch body, a separate,
# self-contained kernel verified correct against its own oracle test
# independent of `push_q4k_product_reduce_body`. Not invented to compose
# with `metal-q4k-split-k` either: `push_q4k_single_fetch_body` has no
# split-aware dispatch loop of its own, so enabling both together simply
# runs the single-fetch body without split-K's extra parallelism -- correct,
# not combined.
metal-q4k-single-fetch = ["metal"]
# Widens the cooperative-reduce (`msl.rs`'s `push_cooperative_reduce_body`)
# threadgroup dispatch from a hardcoded `SIMD_WIDTH` (32) to
# `cooperative_reduce_width`'s reduction-extent-scaled width, plus the
# two-level `simd_sum`-then-`threadgroup`-fold tail that width requires
# (`push_cooperative_reduce_tail`). Measured defect this closes:
# `docs/discipline.md`'s row for this initiative — a 4096-element RMS-norm
# sum dispatched 32 threads, each looping 128 times serially, 5.4x the
# ~4us dispatch floor. Default-off: this is a second, riskier dispatch
# shape for the reduce family (same framing `metal-tiled-gemm` above
# carries for the GEMM family) and does not earn the production default
# until an e2e bench shows the full stack wins with it on. Depends on
# `metal` only (not `metal-tiled-gemm`): the two features touch disjoint
# arms of `push_cooperative_reduce_body` (this one skips
# `q4k_super_block_tiled`'s arm entirely, by construction) and compose
# independently.
metal-wide-cooperative-reduce = ["metal"]
# Thread-local pool for op-OUTPUT device buffers (`allocate_buffer`'s callers
# in `encode_op`) reused ACROSS `execute_plan` calls -- see `metal.rs`'s
# `OUTPUT_BUFFER_POOL` doc for the liveness argument (buffers are reclaimed
# only after the single per-call `waitUntilCompleted`, never mid-program) and
# `proxima-tensor/docs/discipline.md` for the measured `op_setup` cost this
# targets. Default-off: this is a new allocation-lifetime policy on top of
# the production `execute_plan` path and does not earn the default until a
# decode-profile bench (tracked separately) shows the win. Depends on
# `metal`, not just `std`: the pool lives entirely inside `metal.rs`.
metal-buffer-pool = ["metal"]
# CARD 6.5: a `BufferArena` hung off the cached `Plan` (built once in `plan()`,
# from `node_retirement`'s own liveness ranges over `prepared.resolved` --
# whole `MetalBuffer`s only, size-class free-list reuse, never sub-allocated,
# `effective_outputs` excluded from the free list by the same exclusion
# `node_retirement` already applies) plus a `PlanUniforms` vector (one uniform
# buffer per plan position, written in place by `encode_op`, bypassing the
# content-keyed `UNIFORM_BUFFERS` cache entirely on this path). Unlike
# `metal-buffer-pool` above -- a per-call, per-op thread-local hashmap pop/push
# that measured a LOSS (+3.6 ms/token) because it still pays runtime
# bookkeeping on every hit -- this feature pays its allocation cost ONCE, at
# plan-build time (a plan-cache miss), so a plan-cache HIT touches neither
# `allocate_buffer` nor `upload_uniforms` at all. `execute_plan_with_placements`
# (the default decode path) is the one this targets; `execute_plan` (no
# placements) is untouched. Default-off: unproven against the production
# default until the e2e decode-step bench lands. Depends on `metal`, not just
# `std`: both new types are `objc2-metal` buffer handles.
metal-plan-stable-buffers = ["metal"]
# `execute_plan_with_placements` opens its one compute encoder with
# `computeCommandEncoderWithDispatchType(Concurrent)` instead of
# `computeCommandEncoder()` (which implies `Serial`), so two independent
# dispatches (e.g. Q/K/V projected from one normed input, or gate+up from one
# input) no longer pay an implicit whole-resource barrier and pipeline drain
# between them. `metal.rs`'s own `HazardTracker` walks `prepared.resolved`
# once per op, tracking which buffers were written/read since the last
# barrier (identity = `Retained::as_ptr`, matching Metal's own automatic
# tracker's whole-`MTLResource` granularity per this function's doc, not a
# sub-range), and emits `memoryBarrierWithScope(Buffers)` only at a genuine
# RAW/WAW/WAR hazard -- uniform and gather-fault buffers are excluded, never
# hazards. Default-off: unproven against the production default until the
# e2e decode-step bench lands. Depends on `metal`, not just `std`: both new
# Metal API calls (`computeCommandEncoderWithDispatchType`,
# `memoryBarrierWithScope`) live behind `objc2-metal` features `metal` already
# enables.
metal-concurrent-dispatch = ["metal"]
# Split-K for the row-blocked packed Q4_K/Q5_K/Q6_K matvec
# (`msl.rs`'s `push_packed_row_blocked_body`): below a target simdgroup count
# (`sized::PACKED_ROW_SPLIT_K_TARGET_SIMDGROUPS`) a row-group's reduction axis
# is split across multiple simdgroups per threadgroup instead of pinning
# parallelism to `rows / PACKED_ROWS_PER_GROUP` -- see
# `docs/discipline.md`'s split-K row for the measured mechanism (simdgroup
# count, not threadgroup width, is what starves attn_k/attn_v). Default-off:
# unproven against the tiled-GEMM path and the plain row-blocked path until an
# e2e bench lands. Depends on `metal` for the same reason `metal-tiled-gemm`
# does: the eligibility gate and kernel body live in `msl.rs` (alloc-tier),
# but the dispatch geometry only has meaning for a Metal dispatch.
metal-q4k-split-k = ["metal"]
# `nsg=2` threadgroup geometry for the row-blocked packed path (`msl.rs`'s
# `tiled_gemm_threadgroup_width`), mirroring ggml's `N_SG_Q4_K`
# (`ggml-metal-impl.h:33`): 2 simdgroups cooperate per threadgroup instead of
# 1, halving threadgroup count at the same `grid.threads`. Default-off per
# the same discipline as `metal-tiled-gemm` above -- a geometry change earns
# the production default only after the nano bench (`docs/discipline.md`
# ROW 270) and a decode-step seal on a quiet box, not on the mechanism
# argument alone.
metal-packed-row-nsg2 = ["metal"]
# Portable GPU execution driver (src/wgsl.rs, src/wgpu_driver.rs) — the
# wgpu/WGSL counterpart of `metal` above, one abstraction layer over: same
# `BoundOp` descriptor, same emit-then-drive split, different target ISA
# (WGSL instead of MSL) and different device API (wgpu instead of objc2-metal).
# Non-default and std-only: `wgpu`'s `Instance`/`Device`/`Queue` are platform
# objects, not something an alloc-tier build can construct.
wgpu-backend = ["std", "dep:wgpu", "dep:pollster", "dep:bytemuck", "proxima-tensor/std"]
# Lets a caller hand `execute_plan_with_placements` a buffer IT owns and a
# byte offset, so one op's output lands directly in that buffer instead of a
# fresh `allocate_buffer` every dispatch (`metal.rs`'s own module doc,
# "dispatch_op ... allocate_buffer ... always"). Default-off and additive
# only: every new item is `#[cfg(feature = "metal-output-placement")]`, so an
# off build never compiles the placement map or the retire-exclusion check
# and `execute_plan`'s own dispatch loop is untouched source and behavior.
# Depends on `metal`, not just `std`: `PlacedBuffer` is an `objc2-metal`
# buffer handle, meaningless off that backend.
metal-output-placement = ["metal"]
# passthrough to `proxima-tensor/kv-capacity-bucket` -- omega itself has no
# plan cache and nothing here changes; `proxima-model-interop`'s
# `BackendRuntime` is the only plan-cache owner this feature affects. Wired
# through this crate purely so `proxima-model-interop`'s own
# `kv-capacity-bucket` feature can reach `sized::KV_BUCKET_TOKENS` and the
# `zero_placed_buffer` helper below through one dependency edge, mirroring
# every other `proxima-tensor/*` passthrough in this file.
kv-capacity-bucket = ["proxima-tensor/kv-capacity-bucket"]
# Line-for-line port of ggml's `kernel_mul_mv_q4_K_f32_impl<4,2,32>`
# (`ggml-metal.metal:5086-5193`, MIT-licensed, upstream:
# https://github.com/ggml-org/llama.cpp/blob/master/ggml/src/ggml-metal/ggml-metal.metal)
# for the row-blocked packed `Q4_K` matvec (`msl.rs`'s `push_q4k_ggml_port_body`).
# Every prior landing on this path (`q4k_pair_dot`'s `plain_product` arm,
# `metal-q4k-mask-fma`, `metal-q4k-single-fetch`) is a RE-DERIVATION of pieces
# of ggml's technique through this crate's own header-decode/`q4k_run8`
# abstractions -- this feature instead transcribes ggml's `sc16`/`kmask1..3`
# scale extraction and `acc1`/`acc2` masked-word accumulation verbatim, so the
# only difference left from the incumbent is address computation (this
# crate's per-axis `operand_base`/`operand_strides` reads instead of ggml's
# raw `nb01` pointer walk). Also sets the dispatch geometry to ggml's own
# `nsg=2`/`nr0=4` (64-thread threadgroups, `tiled_gemm_threadgroup_width`)
# under this feature specifically, since ggml's nsg=2 threadgroup was
# measured a FOUR-time negative every time it was tried on OUR body
# (`metal-packed-row-nsg2`, ledger ROWs 249,251-254,259-260,265-267) --
# untested until now is nsg=2 paired with ggml's OWN math rather than ours.
# Default-off per the same discipline as `metal-tiled-gemm` above: a kernel
# body rewrite earns the production default only after a quiet-box
# decode-step seal, not on the "verbatim port" argument alone.
metal-q4k-ggml-port = ["metal"]
[dependencies]
bytemuck = { version = "1.25.2", optional = true }
pollster = { version = "1.0.1", optional = true }
proxima-tensor = { path = "../proxima-tensor", default-features = false, features = ["alloc"] }
thiserror = { workspace = true, default-features = false }
# `wgsl`: this crate emits WGSL, never SPIR-V/HLSL text, so no other shader
# frontend is needed. `metal`: the backend this box actually dispatches
# through on arm64 macOS. `vulkan`: the backend every non-mac target (Linux
# CI, the versailles RTX 2070) actually dispatches through — without it
# `wgpu::Instance::request_adapter` finds zero backends on those hosts and
# every `wgpu_parity` test panics before it can run. Proven sufficient on
# versailles (Arch, x86_64, RTX 2070): 11/11 `wgpu_parity` tests pass,
# including the Mistral forward and the cooperative subgroup-width-32 path.
# `dx12`/`gles` stay off: nothing in this crate targets Windows or WebGL yet
# — a future landing adds them as their own log row, not silently here.
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "metal",
    "vulkan",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# objc2: the message-send runtime (Retained<T>, extern_methods!) every Metal
# call below goes through. Already in the workspace's transitive graph via
# objc2-core-foundation/objc2-system-configuration — this stays in-family
# rather than adding a second FFI story.
objc2 = { version = "0.6.4", optional = true }
# objc2-metal: generated MTLDevice/MTLLibrary/MTLBuffer/... bindings, which is
# what lets `execute` compile MSL source and dispatch a compute pass without
# shelling out to `xcrun`. Feature list is exactly the protocols the driver
# calls: device + runtime compile (MTLDevice, MTLLibrary), buffers
# (MTLBuffer, MTLResource, MTLAllocation), and dispatch (MTLCommandQueue,
# MTLCommandBuffer, MTLCommandEncoder, MTLComputeCommandEncoder,
# MTLComputePipeline, MTLTypes for MTLSize). `objc2-core-foundation` gates
# `MTLCommandBuffer::GPUStartTime`/`GPUEndTime` (`CFTimeInterval`), which the
# `instrument`-gated per-op diagnostic timing in `metal.rs` reads back --
# nothing on the production `execute`/`execute_plan` path calls either.
# `MTLBlitCommandEncoder` is test-only (`omega/tests/device_streaming_ceiling.rs`'s
# `storageModePrivate` arm needs a blit fill; no production call site uses it).
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLDevice",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLTypes",
    "MTLBlitCommandEncoder",
    "block2",
    "objc2-core-foundation",
], optional = true }
# objc2-foundation: NSString (kernel source and entry name go in), NSError
# (a compile failure's localizedDescription comes out) — the two Foundation
# types the driver actually touches. `NSRange` is pulled in transitively by
# `objc2-metal`'s `MTLBlitCommandEncoder` feature above; listed explicitly so
# this file states what is actually used rather than relying on unification.
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
    "NSError",
    "NSObject",
    "NSRange",
], optional = true }
# half: real IEEE-754 binary16 <-> f32 conversion (round-to-nearest-even,
# subnormal-correct) for `upload_block`/`read_back`'s device-buffer
# marshalling — the arithmetic hand-rolling a bit-twiddled version of this
# gets wrong at the edges (subnormals, rounding ties) is exactly what a
# narrow, already-in-the-workspace-transitive-graph (via ciborium) crate is
# for. `default-features = false`: only the no_std-safe `f16`/`bf16` scalar
# types, no `std`/`alloc`/serde machinery this driver never touches. Lives in
# this macOS-only section because `src/metal.rs`, its only caller, is itself
# `target_os = "macos"`-gated.
half = { version = "2.7.1", default-features = false, optional = true }
# proxima-telemetry: the `Counter` instrument `upload_block` increments to
# report which real calls took the no-copy path vs the copying one — see
# the module doc's "Host buffer upload" section. Default features (implies
# `alloc`) are enough for `metric::Counter`/`counter!`; no OTLP/export
# machinery is needed since this driver only ever reads the counter back
# in-process (its own test suite).
proxima-telemetry = { workspace = true, optional = true }
# libc: `sysconf(_SC_PAGESIZE)` for `page_size` — the alignment unit
# `newBufferWithBytesNoCopy` requires, queried from the host rather than
# hard-coded (macOS's `libc` has no `getpagesize()` binding, unlike Linux's).
libc = { workspace = true, optional = true }
# block2: `newBufferWithBytesNoCopy_length_options_deallocator`'s
# `deallocator` parameter is typed `Option<&block2::DynBlock<..>>` by
# objc2-metal's own binding (gated behind its `block2` feature above) — this
# driver always passes `None` (Metal never owns the caller's memory), but
# the parameter's type still has to resolve.
block2 = { version = "0.6", default-features = false, optional = true }

[build-dependencies]
# reads `omega-runtime.toml` at build time (`build.rs`'s `emit_sizing_consts`,
# mirroring `proxima-tensor/build.rs`'s function of the same name) --
# build-dependency only, never links into the compiled artifact.
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
conflaguration = { workspace = true, features = ["toml"] }
criterion.workspace = true
half = { version = "2.7.1", default-features = false }
proxima = { workspace = true, features = ["test-support", "test-support-tokio"] }
proxima-autograd = { path = "../proxima-autograd" }
proxima-gguf = { path = "../proxima-gguf", features = ["std"] }
proxima-onnx = { path = "../proxima-onnx" }
proxima-safetensors = { path = "../proxima-safetensors" }
proxima-telemetry = { workspace = true, features = ["alloc"] }
# `test-support` pulls in `proxima_tensor::test_support::Lcg`, the same
# deterministic PRNG proxima-tensor's own examples share — see that crate's
# Cargo.toml for why this is a feature, not a default. `cached-attention-streaming`
# is named explicitly here too, now redundant with `metal`'s own default per
# ROW 282 but kept so `omega/tests/metal_real_forward.rs` still builds under
# any feature set that drops `metal` but keeps `test-support`.
proxima-tensor = { path = "../proxima-tensor", features = ["config", "test-support", "cached-attention-streaming"] }
rustix.workspace = true
tempfile.workspace = true
toml.workspace = true

[[bench]]
name = "metal_vs_cpu"
harness = false
required-features = ["metal"]

[[bench]]
name = "wide_cooperative_reduce"
harness = false
required-features = ["metal"]
