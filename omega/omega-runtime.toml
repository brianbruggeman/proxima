# build-time execution-policy sizing for omega's MSL kernel selection. read by
# build.rs, emitted as consts into OUT_DIR/omega_sized.rs. mirrors
# proxima-tensor/proxima-tensor-runtime.toml's shape (that file's own build.rs
# `emit_sizing_consts` / `resolve_int`). every key below can also be
# overridden per-build via an `OMEGA_<SECTION>_<KEY>` env var (uppercased);
# each override consulted emits its own `cargo:rerun-if-env-changed` line so a
# cached build never ignores it.
#
# the full measurement record behind each value lives on the consuming
# const's doc comment in src/sized.rs, not here — this file carries only the
# number and a one-line pointer.

[packed_row_block]
# number of independent 32-lane SIMD-groups Metal packs into one threadgroup
# for the row-blocked packed-Q4_K/Q5_K/Q6_K matmul kernel
# (`push_packed_row_blocked_body`). Each simdgroup folds its own
# PACKED_ROWS_PER_GROUP(4) output rows entirely independently -- no
# threadgroup-shared memory, no barrier, no dependency on
# `thread_position_in_threadgroup` -- so raising this is purely a dispatch
# occupancy change; see sized::PACKED_ROW_BLOCK_SIMDGROUPS. Must be a power
# of two so `simdgroups * SIMD_WIDTH` stays a clean divisor/multiple
# relationship with the grid (`msl.rs`'s `grid_threads` row-block arm), and
# `<= 32` so `simdgroups * SIMD_WIDTH` never exceeds the 1024-thread
# per-threadgroup ceiling every Apple GPU family this crate targets enforces.
simdgroups = 1

# `metal-q4k-split-k`-only ceiling on the row-blocked packed matmul's OUTPUT
# row count (`output_total` in `msl.rs`'s `packed_row_dispatch`) above which
# split-K never engages, regardless of what `[packed_row_split_k]`'s
# `target_simdgroups`/`max_split` would otherwise compute -- see
# `msl.rs`'s `packed_row_split_factor` and sized::PACKED_ROW_SPLIT_K_MAX_ROWS.
# `target_simdgroups`(2048) alone already lets a shape's own base-simdgroup
# count push its factor to 1 once `base_simdgroups >= target_simdgroups`, but
# integer division means that fall-off is gradual (a 4096-row op still gets
# factor=2 through this landing's own measured decode-graph table, even
# though its GB/s was already close to the `ffn_*` rate at 1024 base
# simdgroups) -- this key is the hard, row-count-scoped cutoff a caller can
# tune independently of the simdgroup-target arithmetic, per the sweep in
# `docs/discipline.md`'s row for this landing. 0 disables the ceiling
# (split-K then engages purely off `target_simdgroups`/`max_split`, i.e. this
# landing's pre-existing behaviour). Overridable per-build via
# `OMEGA_PACKED_ROW_BLOCK_SPLIT_K_MAX_ROWS`.
split_k_max_rows = 4096

[tiled_gemm]
# below this many activation rows (tokens) in one dispatch, the row-blocked
# packed-matmul kernel (`push_packed_row_blocked_body`) runs instead of the
# `simdgroup_matrix`-tiled path (`push_tiled_gemm_body`) — see
# sized::TILED_GEMM_MIN_TOKENS. `feature = "metal-tiled-gemm"`-only; emitted
# only when that feature is active.
min_tokens = 8

# per-threadgroup output tile shape (ROW 109 redesign) — ports
# `ggml-metal.metal:6487` (`BLOCK_SIZE_M`). Must be a multiple of 16 (2
# simdgroup row-halves x TILE_DIM(8) x THREAD_MAT_M) — see
# sized::TILED_GEMM_BLOCK_M.
block_m = 64
# ports `ggml-metal.metal:6488` (`BLOCK_SIZE_N`). Must be a multiple of 16 —
# see sized::TILED_GEMM_BLOCK_N.
block_n = 32
# ports `ggml-metal.metal:6489` (`BLOCK_SIZE_K`) — the K-step width one
# threadgroup barrier pair amortizes over. Must divide 256 (`Q4K_BLOCK_ELEMENTS`)
# evenly so the reduction loop never reads past a real Q4_K weight's extent,
# AND must be a multiple of 8 (ROW 113's `q4k_run8`-batched weight-staging
# loop) — see sized::TILED_GEMM_BLOCK_K.
block_k = 32

[wide_cooperative_reduce]
# upper bound on the threadgroup width `msl::cooperative_reduce_width` picks
# for a cooperative reduce (`feature = "metal-wide-cooperative-reduce"` only)
# — NOT a query of the device's real `maxTotalThreadsPerThreadgroup`, which
# emission has no handle to (see sized::SIMD_WIDTH's own doc for the same
# constraint on the hardware-fixed 32). `crate::metal::dispatch` clamps
# `grid.threadgroup_width` to the pipeline's real cap before dispatching, so
# a value above the true hardware limit only wastes grid, never a
# correctness hazard — 256 (8 simdgroups) is conservative against every
# Apple GPU family this crate targets. Must be a multiple of 32
# (SIMD_WIDTH) — see sized::WIDE_COOPERATIVE_REDUCE_MAX_WIDTH.
max_width = 256

[cooperative_reduce]
# below this many elements in the reduced axis, `msl::reduce_is_cooperative`
# routes to the one-thread-per-output serial fold (`push_serial_reduce_body`)
# instead of the `SIMD_WIDTH`(32)-lane cooperative fold
# (`push_cooperative_reduce_body`) -- see sized::COOPERATIVE_REDUCE_MIN_LEN.
# 0 disables the threshold entirely -- every reduce that qualifies otherwise
# (see `reduce_is_cooperative`'s own doc: no gather, an
# associative/commutative `ScalarOp`) stays cooperative, the routing every
# build before this key existed used.
#
# MEASURED FOR QWEN35, moving only unit-axis reductions: the real checkpoint
# decode moved 240 reductions to the serial renderer and reduced the
# non-profile decode events from 71-78 ms/token to 65-68 ms/token while
# emitting the same 12-token answer and staying below 0.66 GB RSS. Larger
# short-reduce thresholds remain excluded because the existing attention
# evidence shows that routing 64-element score folds serial is slower.
min_len = 2

[packed_row_split_k]
# below this many simdgroups (`output_rows / PACKED_ROWS_PER_GROUP`), the
# row-blocked packed-matmul kernel splits the reduction (k) axis across
# multiple simdgroups per threadgroup instead of leaving parallelism pinned
# to `rows / 4` — see `msl.rs`'s `packed_row_split_factor` and
# sized::PACKED_ROW_SPLIT_K_TARGET_SIMDGROUPS. The measured decode-graph
# table (this landing's own discipline row) shows GB/s rising monotonically
# with simdgroup count through at least 1024 (attn_q/attn_output/ffn_down);
# 2048 sits one step past that observed range, low enough that
# `max_split`(8) keeps every real starved shape (attn_k/attn_v at 256 base
# simdgroups) inside its cap rather than saturating it, high enough to move
# the two families the measured mechanism actually names as starved.
# `feature = "metal-q4k-split-k"`-only; emitted only when that feature is
# active.
target_simdgroups = 2048
# ceiling on the split factor — bounds the per-threadgroup thread count to
# `max_split * SIMD_WIDTH`(32) so `crate::metal::dispatch`'s
# `.min(max_threadgroup)` clamp (typically 1024 threads) never engages and
# silently shrinks the threadgroup out from under the grid-thread count
# `grid_threads` already committed to (`omega-runtime.toml`'s own
# `require_split_k_headroom` enforces `max_split * 32 <= 1024` at build
# time) — see sized::PACKED_ROW_SPLIT_K_MAX_SPLIT.
max_split = 8

[packed_row_multi_activation]
# maximum number of activation ("token") rows one simdgroup folds against a
# streamed weight row in the row-blocked packed matmul kernel's multi-row
# fold (`msl.rs`'s `push_packed_row_multi_row_body`, `push_packed_row_blocked_body`'s
# own `token_total > 1` branch) -- the register-tiling cap on `s`. Each
# streamed weight block's decode (header + nibble extract) happens ONCE per
# block iteration and is folded against every one of these activation rows
# in registers, so raising this amortizes weight streaming over more tokens
# but grows live registers roughly linearly: the activation gather alone is
# `group * 32` floats per lane (`Q4K_BLOCK_ELEMENTS / lanes_per_block`(32)
# elements per sub-block), plus `group * PACKED_ROWS_PER_GROUP`(4)
# accumulators. `token_total` above this cap is TILED at the grid level
# (`ceil(token_total / group)` simdgroup-groups along the token axis), not
# truncated -- see sized::PACKED_ROW_ACTIVATION_GROUP. Must be a power of
# two, <= 32 (an Apple GPU simdgroup's per-thread register file makes
# anything larger a spill hazard, the same ceiling
# `packed_row_block.simdgroups` enforces for occupancy). Overridable
# per-build via `OMEGA_PACKED_ROW_MULTI_ACTIVATION_GROUP`. Always emitted --
# the multi-row fold is unconditional, keyed off the concrete token extent
# `classify_packed_row_block` derives per op, not a compile feature.
group = 8

[spans]
# capacity of `metal::UNIFORM_BUFFERS`, the content-keyed cache of uploaded
# uniform-blob `MTLBuffer`s (see `metal.rs`'s `upload_uniforms` and
# sized::UNIFORM_CACHE_ENTRIES). The cache has no eviction below this
# landing, so any workload whose uniform bytes vary per call (different
# shapes, different `cached_len` without bucketing) grows it without bound —
# a plan-stable decode holds 57 entries after 3 steps (measured,
# `uniform_cache_len`), well under this default. Cost of raising it: one
# `MTLBuffer` per additional distinct uniform blob retained. Cost of
# lowering it below a plan's real distinct-blob count: LRU evicts entries
# still in rotation, turning cache hits into misses (a correctness-neutral,
# perf-only regression -- `upload_uniforms` re-uploads on a miss).
# Overridable per-build via `OMEGA_SPANS_UNIFORM_CACHE_ENTRIES`.
uniform_cache_entries = 4096

[output_pool]
# per-`(bucket, dtype)` cap on retained buffers in `metal::OUTPUT_BUFFER_POOL`
# (`feature = "metal-buffer-pool"`-only) -- see sized::OUTPUT_POOL_MAX_PER_BUCKET
# and `metal.rs`'s own doc on the const this replaces. A safety net against a
# pathological program shape (many parallel same-size branches); steady
# decode never approaches it. Overridable per-build via
# `OMEGA_OUTPUT_POOL_MAX_PER_BUCKET`.
max_per_bucket = 8

[arena]
# CARD 6.5's memory gate (MG-3): the plan-owned transient-buffer arena's
# cap, in bytes (`feature = "metal-plan-stable-buffers"`-only) -- see
# sized::ARENA_TRANSIENT_CAP and `metal.rs`'s `build_buffer_arena`, which
# prints its own peak against this before returning; a peak above it is
# this card's own kill condition. Overridable per-build via
# `OMEGA_ARENA_TRANSIENT_CAP`.
transient_cap = 172_812_125

[wgsl]
# threads per workgroup every v1 WGSL kernel dispatches with -- see
# sized::WORKGROUP_SIZE and `wgsl.rs`'s own doc: any positive value is
# legal WGSL, 64 matches `crate::metal`'s own occupancy-driven default
# width for the non-cooperative (serial) kernels this module emits
# exclusively. Always emitted -- `wgsl.rs` is not feature-gated, unlike the
# `wgpu-backend`-only driver that consumes its output.
# Overridable per-build via `OMEGA_WGSL_WORKGROUP_SIZE`.
workgroup_size = 64

[attention_context_chunks]
# `render_cached_attention`'s key range, split across this many simdgroups
# per `(query_row, kv_head, group)` threadgroup -- llama.cpp's own
# `kernel_flash_attn_ext_vec` stride partition
# (ggml-metal.metal:4016-4017, `ic0 += C*nsg`), ported to this kernel's
# per-key loop (`C=1` here, since the body already iterates one key at a
# time rather than llama's KV-block width). `chunks =
# clamp(ceil(context_length / keys_per_chunk), 1, cap)` --
# `msl::context_chunks_for`. Raising `keys_per_chunk` lowers chunk count
# (less parallelism, less merge overhead); raising `cap` allows more
# simdgroups on long contexts at the cost of more `threadgroup` memory for
# the cross-simdgroup online-softmax merge. Overridable per-build via
# `OMEGA_ATTENTION_CONTEXT_CHUNKS_KEYS_PER_CHUNK` /
# `OMEGA_ATTENTION_CONTEXT_CHUNKS_CAP`.
keys_per_chunk = 16
cap = 4

[attention_block]
# `render_cached_attention`'s in-block staging width -- llama.cpp's own
# `kernel_flash_attn_ext_vec` keys-per-block constant `C` (ggml-metal.metal
# `:4016-4017`, `ic0 += C*nsg`), ported onto our per-simdgroup key walk. A
# block of `width` keys is staged into `threadgroup` memory (`ss[]`) and
# online-softmax-reduced ONCE per block (one `simd_max`/`simd_sum` pair),
# rather than once per key -- see `omega/src/msl.rs`'s `block_width_for` and
# ROW notes on `NumericRewrite::TreeReduce`. `width = 1` renders today's
# strictly-sequential per-key body, byte-for-byte -- the two are the same
# generated MSL text at `width = 1`, never a separate code path. `width` MUST
# be a multiple of 32 (SIMD_WIDTH): the online-softmax combine fires once
# per 32-lane sub-block (`simd_max`/`simd_sum` operate over the current 32
# lanes), and within each 32-lane sub-block the Q*K stage covers `NE = 4`
# concurrent keys per `cc` iteration (`ty = lane / 8` picks which of the 4).
# Overridable per-build via `OMEGA_ATTENTION_BLOCK_WIDTH`.
width = 32

[attention_splits]
# `render_cached_attention`'s key range, split across this many THREADGROUPS
# per `(query_row, kv_head)` pair -- llama.cpp's own `nwg` (fixed 32,
# `ggml-metal-ops.cpp:3457-3466`), ported here as a live-length-derived
# count rather than a fixed one, because our threadgroup is heavier
# (cooperative `query_groups`-way K/V sharing across simdgroups) than
# llama's per-Q-head one.
#
# ROW 383: the divisor has a KNEE, because the mechanism is genuinely
# non-monotonic -- more splits helps at the tiny decode window (occupancy
# starved: normally only 1 threadgroup, so splitting buys free parallelism)
# AND at huge contexts (throughput-bound: enough work per split to amortize
# the merge-dispatch overhead), but HURTS in between (occupancy is already
# adequate at 4 splits, so a finer divisor only adds fixed per-split
# overhead -- 512 keys measured 170-177us at 8/16/32 splits, all within
# noise of each other, vs 89.5us at the old 4-split rule; ROW 383's own
# `omega/tests/row_376_cached_attention_batched.rs` cells).
# `keys_per_split = clamp(ceil(live_len / divisor), 1, max)` where
# `divisor = keys_per_split` (this key, small) below `keys_per_split_at_scale`
# and `divisor = keys_per_split_at_scale` (large) at or above it --
# `msl::splits_for`. Overridable per-build via
# `OMEGA_ATTENTION_SPLITS_KEYS_PER_SPLIT` /
# `OMEGA_ATTENTION_SPLITS_KEYS_PER_SPLIT_AT_SCALE` / `OMEGA_ATTENTION_SPLITS_MAX`.
# ROW 381: at the decode scoreboard window (capacity 39-78 keys) 16 measured
# 36.1us median vs the (then-only) divisor 128's 43.6us bare (beyond 2x CoV)
# by giving that window 3 threadgroups instead of 1.
# ROW 383: reinstates 128 as `keys_per_split_at_scale`, the ORIGINAL
# pre-ROW-381 divisor, for any context at or above it -- this is exactly the
# value ROW 381 measured winning at 512 keys (splits=4, 89.5us) and it
# already clamps to `max` at 4096 keys (splits=32) the same as the small
# divisor did, so nothing regresses at scale while the decode window keeps
# ROW 381's win.
keys_per_split = 16
keys_per_split_at_scale = 128
max = 32

[packed_row_nsg]
# `tiled_gemm_threadgroup_width`'s nsg multiplier for the packed
# row-blocked path, shared by `metal-packed-row-nsg2` and
# `metal-q4k-ggml-port` (either feature emits this; both want the
# identical value) -- see sized::PACKED_ROW_NSG and `msl.rs`'s
# `packed_row_nsg_factor`. ggml's own `N_SG_Q4_K` is 2; must be a power of
# two and `<= 32` for the same reason `packed_row_block.simdgroups` is.
# Overridable per-build via `OMEGA_PACKED_ROW_NSG_WIDTH`.
width = 2

[load_time_fit]
# `proxima-model-interop`'s own load-time memory-fit gate reads these two
# constants (via `omega::sized::LOAD_TIME_FIT_OS_HEADROOM_BYTES` /
# `..._ARENA_ALLOWANCE_BYTES`) rather than hard-coding either — this crate
# has no OS-facing runtime knowledge of its own, `omega` is the one crate
# every GPU-backed build already links for device facts
# (`metal::system_memory_facts`), so its own sizing toml is where a
# byte-budget constant belongs (principle 12: no magic numbers in source).

# Bytes of slack reserved for the OS and every other process on this host,
# subtracted from `min(recommendedMaxWorkingSetSize, hw.memsize)` before a
# checkpoint's own budget (file bytes + placed-KV + arena allowance) is
# compared against the limit. 8 GiB is a conservative default for a
# desktop/workstation host running a browser and IDE alongside a serving
# process -- override lower on a headless box via
# `OMEGA_LOAD_TIME_FIT_OS_HEADROOM_BYTES`.
os_headroom_bytes = 8_589_934_592

# The largest measured `BufferArena` peak across every step in
# `proxima-tensor/docs/discipline.md` ROW 391's own per-step device-memory
# table (~27 MB, the arena's transient per-op output/uniform/fault-buffer
# allocation that `emit_device_memory_by_class`'s own doc says is never
# separately sized) -- a fixed allowance rather than a live measurement
# because the arena's real peak is only known AFTER a forward runs, and this
# budget must be computed BEFORE the first weight upload.
arena_allowance_bytes = 28_311_552
