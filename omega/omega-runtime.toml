# build-time execution-policy sizing for omega's MSL kernel selection. read by
# build.rs, emitted as consts into OUT_DIR/omega_sized.rs. mirrors
# proxima-tensor/proxima-tensor-runtime.toml's shape (that file's own build.rs
# `emit_sizing_consts` / `resolve_int`). every key below can also be
# overridden per-build via an `OMEGA_<SECTION>_<KEY>` env var (uppercased);
# each override consulted emits its own `cargo:rerun-if-env-changed` line so a
# cached build never ignores it.
#
# the full measurement record behind each value lives on the consuming
# const's doc comment in src/sized.rs, not here — this file carries only the
# number and a one-line pointer.

[packed_row_block]
# number of independent 32-lane SIMD-groups Metal packs into one threadgroup
# for the row-blocked packed-Q4_K/Q5_K/Q6_K matmul kernel
# (`push_packed_row_blocked_body`). Each simdgroup folds its own
# PACKED_ROWS_PER_GROUP(4) output rows entirely independently -- no
# threadgroup-shared memory, no barrier, no dependency on
# `thread_position_in_threadgroup` -- so raising this is purely a dispatch
# occupancy change; see sized::PACKED_ROW_BLOCK_SIMDGROUPS. Must be a power
# of two so `simdgroups * SIMD_WIDTH` stays a clean divisor/multiple
# relationship with the grid (`msl.rs`'s `grid_threads` row-block arm), and
# `<= 32` so `simdgroups * SIMD_WIDTH` never exceeds the 1024-thread
# per-threadgroup ceiling every Apple GPU family this crate targets enforces.
simdgroups = 1

# output rows one simdgroup folds against a single load of the activation
# when the weight is `Q6_K` (`msl::codec_rows_per_simdgroup_default`). The
# other codecs take 4. llama.cpp's `N_R0_Q6_K` is 2 at the revision this was
# compared against (`ggml-metal-impl.h`, `N_SG_Q6_K` 2): the activation
# gather `yl[16]` is shared by two rows, and a 262144-row head launches half
# the simdgroups. Raising it costs one `sumf` accumulator and one block
# pointer per row per lane; `Q6_K` decodes `ql`, `qh` and the scales per
# row, so register pressure grows faster than `Q4_K`'s. 1 reproduces the
# shape before this key. Overridable per-build via
# `OMEGA_PACKED_ROW_BLOCK_Q6K_ROWS`.
q6k_rows = 2

# `metal-q4k-split-k`-only ceiling on the row-blocked packed matmul's OUTPUT
# row count (`output_total` in `msl.rs`'s `packed_row_dispatch`) above which
# split-K never engages, regardless of what `[packed_row_split_k]`'s
# `target_simdgroups`/`max_split` would otherwise compute -- see
# `msl.rs`'s `packed_row_split_factor` and sized::PACKED_ROW_SPLIT_K_MAX_ROWS.
# `target_simdgroups`(2048) alone already lets a shape's own base-simdgroup
# count push its factor to 1 once `base_simdgroups >= target_simdgroups`, but
# integer division means that fall-off is gradual (a 4096-row op still gets
# factor=2 through this landing's own measured decode-graph table, even
# though its GB/s was already close to the `ffn_*` rate at 1024 base
# simdgroups) -- this key is the hard, row-count-scoped cutoff a caller can
# tune independently of the simdgroup-target arithmetic, per the sweep in
# `docs/discipline.md`'s row for this landing. 0 disables the ceiling
# (split-K then engages purely off `target_simdgroups`/`max_split`, i.e. this
# landing's pre-existing behaviour). Overridable per-build via
# `OMEGA_PACKED_ROW_BLOCK_SPLIT_K_MAX_ROWS`.
split_k_max_rows = 4096

[tiled_gemm]
# below this many activation rows (tokens) in one dispatch, the row-blocked
# packed-matmul kernel (`push_packed_row_blocked_body`) runs instead of the
# `simdgroup_matrix`-tiled path (`push_tiled_gemm_body`) — see
# sized::TILED_GEMM_MIN_TOKENS. `feature = "metal-tiled-gemm"`-only; emitted
# only when that feature is active. 160 because the row-blocked body re-streams
# the weights once per 8-row group while the tiled body pays a fixed ~110 ms
# over it and re-streams once per 32-row tile, so tiled only wins once its
# cheaper per-row slope has repaid that offset. gemma4-E2B Q4_0, KV ~1150,
# median ms per forward, row-blocked / tiled (14 runs over 2 interleaved
# processes, CoV <= 0.4%, speculative_bench --verify-width-sweep): 9 rows
# 73 / 175, 32 rows 141 / 191, 64 rows 272 / 294, 120 rows 650 / 671, 129 rows
# 765 / 783, 144 rows 800 / 809, 160 rows 862 / 812, 192 rows 1012 / 937, 512
# rows 2663 / 2411. 128 rows is a lone tiled win (666 / 636): the tiled cost
# steps up at every 32-row tile edge, so 129..144 lose again. Ubatch-32
# prefill: 495 tok/s row-blocked, 364 tiled.
min_tokens = 160

# per-threadgroup output tile shape (ROW 109 redesign) — ports
# `ggml-metal.metal:6487` (`BLOCK_SIZE_M`). Must be a multiple of 16 (2
# simdgroup row-halves x TILE_DIM(8) x THREAD_MAT_M) — see
# sized::TILED_GEMM_BLOCK_M.
block_m = 64
# ports `ggml-metal.metal:6488` (`BLOCK_SIZE_N`). Must be a multiple of 16 —
# see sized::TILED_GEMM_BLOCK_N.
block_n = 32
# ports `ggml-metal.metal:6489` (`BLOCK_SIZE_K`) — the K-step width one
# threadgroup barrier pair amortizes over. Must divide 256 (`Q4K_BLOCK_ELEMENTS`)
# evenly so the reduction loop never reads past a real Q4_K weight's extent,
# AND must be a multiple of 8 (ROW 113's `q4k_run8`-batched weight-staging
# loop) — see sized::TILED_GEMM_BLOCK_K.
block_k = 32

[grouped_gemm]
# `feature = "metal-grouped-gemm"`-only; the tile shape itself (64 rows by 32
# tokens by 32 deep, 4 simdgroups) is ggml-metal's `kernel_mul_mm_id` geometry,
# fixed in `push_expert_grouped_gemm_body`, not a tunable.
# Contiguous segments the flat token range (the route) is cut into; one
# threadgroup per (expert, row tile, segment) scans only its segment and walks
# that segment's tokens of its expert tile by tile. Route loads per threadgroup
# fall as 1/segments and a heavily routed expert is split across more
# threadgroups, at the price of one partial tail tile per (expert, segment).
# Output bits do not depend on it. Sweep recorded for the previous meaning of
# this key (tiles of one expert dealt round robin, every threadgroup scanning
# the whole route), whole-prefill wall time of a 1000-token prompt on a
# 32-expert top-8 model at 1/2/4/8 (3 runs each, interleaved, CoV 0.7-1.4%):
# 864 / 828 / 848 / 870 ms; the value below is that sweep's minimum and has not
# been re-swept for segments.
route_segments = 2
# How the route reaches the grouped GEMM's threadgroups.
# "segments": every threadgroup scans its own `route_segments` slice of the
# route (`route_segments` above), one dispatch per op.
# "compacted": a prepass dispatch before the GEMM counts the tokens per
# expert, prefix-sums the counts and writes the assignment list expert-major
# into one buffer; the GEMM launches `ceil(tokens / 32) + experts` token tiles
# per row tile and each threadgroup locates its (expert, tile) from the counts,
# so an expert with many tokens gets proportionally many threadgroups and tiles
# past the realized total exit at once. Two dispatches per op; ops with a
# prepass are kept out of horizontal merging and their live capture is marked
# unreplayable. "compacted" is the default: granite prefill (3 processes x 7
# runs, interleaved, text hash equal to the other mode) read 39.994 ms against
# 46.988 ms for "segments" on a 25 token prompt and 246.016 against 246.943 ms
# on a 1000 token prompt.
route_mode = "compacted"
# Adjacent route entries each thread of a threadgroup owns in one scan step.
# A step covers `block_threads * scan_ahead` entries for one barrier pair: the
# loads are independent, so one memory round trip serves them all, and the
# step appends every match it finds (no entry is fetched twice). A larger
# value pays fewer barriers per route scan and keeps more registers live; it
# also grows the pending-token list by `block_threads * 4` bytes per unit
# (threadgroup memory, so occupancy).
scan_ahead = 4
# Route entries one threadgroup of the route prepass owns. The prepass is two
# dispatches (a count pass and a place pass) of `ceil(tokens / this)`
# threadgroups each, so a larger value is fewer threadgroups with a longer
# serial scan each, and a value covering the whole route reproduces the one
# threadgroup prepass. The compaction buffer grows by `threadgroups * experts`
# words of per threadgroup partial counts. Output bytes do not depend on it.
# 256 cuts the 8000 entry route of a 1000 token prompt on a top-8 model into 32
# threadgroups of 8 scan steps, the 32 threadgroup shape the one threadgroup
# per expert timing used (201.8 us against 426.3 us for the one threadgroup
# prepass, `evidence/attr4/summaries/prepass_variants_single_us.md`); it has not
# been swept. Must be a multiple of 32 (SIMD_WIDTH).
prepass_entries = 256

[wide_cooperative_reduce]
# upper bound on the threadgroup width `msl::cooperative_reduce_width` picks
# for a cooperative reduce (`feature = "metal-wide-cooperative-reduce"` only)
# — NOT a query of the device's real `maxTotalThreadsPerThreadgroup`, which
# emission has no handle to (see sized::SIMD_WIDTH's own doc for the same
# constraint on the hardware-fixed 32). `crate::metal::dispatch` clamps
# `grid.threadgroup_width` to the pipeline's real cap before dispatching, so
# a value above the true hardware limit only wastes grid, never a
# correctness hazard — 256 (8 simdgroups) is conservative against every
# Apple GPU family this crate targets. Must be a multiple of 32
# (SIMD_WIDTH) — see sized::WIDE_COOPERATIVE_REDUCE_MAX_WIDTH.
max_width = 256

# upper bound on the threadgroup width of a reduce that carries a broadcast
# epilogue (a row normalization: fold the row, then every lane rewrites its
# share), `msl::broadcast_cooperative_reduce_width`. Same one-lane-per-four-
# elements sizing as `max_width` but its own cap, because a normalization row
# has no tile reuse to trade against occupancy: a cap of 512 lets a
# hidden-width row of 1536 take 384 lanes (12 simdgroups) instead of 256.
# Must stay inside the pipeline's real `maxTotalThreadsPerThreadgroup`
# (`crate::metal::dispatch` clamps to it, and a clamp below the baked width
# desynchronizes the lane math). Multiple of 32. MEASURED (gemma4 E2B, 971 and
# 25-token prompts, interleaved release runs): 512 costs 0.18 ms/token of
# decode and 6 ms of prefill against 256 and changes no granite number, so
# the default is 256, the width every build before this key used. 1024 has
# not been measured here.
broadcast_max_width = 256

[cooperative_reduce]
# below this many elements in the reduced axis, `msl::reduce_is_cooperative`
# routes to the one-thread-per-output serial fold (`push_serial_reduce_body`)
# instead of the `SIMD_WIDTH`(32)-lane cooperative fold
# (`push_cooperative_reduce_body`) -- see sized::COOPERATIVE_REDUCE_MIN_LEN.
# 0 disables the threshold entirely -- every reduce that qualifies otherwise
# (see `reduce_is_cooperative`'s own doc: no gather, an
# associative/commutative `ScalarOp`) stays cooperative, the routing every
# build before this key existed used.
#
# MEASURED FOR QWEN35, moving only unit-axis reductions: the real checkpoint
# decode moved 240 reductions to the serial renderer and reduced the
# non-profile decode events from 71-78 ms/token to 65-68 ms/token while
# emitting the same 12-token answer and staying below 0.66 GB RSS. Larger
# short-reduce thresholds remain excluded because the existing attention
# evidence shows that routing 64-element score folds serial is slower.
min_len = 2
# a fold shorter than this many elements and producing at least
# `serial_min_outputs` outputs takes the one-thread-per-output serial body
# even though it clears `min_len`. The 32-lane group of the cooperative body
# is 24 lanes idle for an 8-long fold, and with a million outputs that idle
# width is the whole cost. MEASURED (granite 1000-token prefill, MoE combine
# fold [1000, 8, 1024], 1,024,000 outputs): cooperative 4134 us/op, serial
# 567.7 us/op; the same serial body on the 1,024-output decode fold slows the
# step by 0.7-0.9 ms, which is why this is a shape rule and `min_len` is not
# raised. 0 disables the rule.
serial_below_len = 32
# outputs at or above which `serial_below_len` applies. Prefill combine has
# 1,024,000; the decode folds measured have under 10,000.
serial_min_outputs = 65536
# elements each lane loads back to back before folding any of them, in the
# cooperative fold's accumulate loop and in a broadcast epilogue's write
# loop (`msl::push_cooperative_reduce_body`). The loop ran one load, one
# fold per trip, so a lane's six `[1, 1536]` loads waited on memory six
# times in a row; issuing `unroll` loads before the first fold pays that
# latency once. The fold order is unchanged (slot 0, 1, ...), so no bit
# moves. Raising it costs `unroll * operands` live registers per lane and
# buys nothing once `unroll * width` covers the reduced extent (gemma4-E2B's
# widest decode norm is 1536 over 256 lanes, 6 per lane: measured 3.30 us
# at 6, 3.36 at 8, 3.45 at 4 against 4.83 at 1). 1 reproduces the former
# loop's schedule. See sized::COOPERATIVE_REDUCE_UNROLL.
unroll = 8
# registers per lane a broadcast epilogue's operand prefetch may hold
# (`msl::broadcast_epilogue_prefetch_unroll`): slots per operand are cut to
# `prefetch_registers / per-element operands`, never above `unroll`. The
# gemma4-E2B hidden-width rmsnorm has 2 such operands (gamma, x) and keeps all
# `unroll` slots; its 15-operand per-layer tail has 8 and gets 4.
prefetch_registers = 32

# how a multi-simdgroup cooperative fold with a broadcast epilogue combines
# the per-simdgroup partials (`msl::push_cooperative_reduce_tail`). 1: every
# lane of every simdgroup reads one partial (the reduction identity past the
# last simdgroup) and folds them with one more simd combine, so the scalar is
# in every lane after ONE barrier -- the structure of llama.cpp's
# `kernel_rms_norm_fuse_impl` (two `simd_sum` passes around a threadgroup
# array). 0: lane 0 folds the partials serially, publishes through shared
# memory, and a second barrier releases the other lanes (the shape before this
# key). The two orders differ in the low bits of a sum; the maximum and
# minimum folds are order-free.
broadcast_simd_fold = 1

[packed_row_split_k]
# below this many simdgroups (`output_rows / PACKED_ROWS_PER_GROUP`), the
# row-blocked packed-matmul kernel splits the reduction (k) axis across
# multiple simdgroups per threadgroup instead of leaving parallelism pinned
# to `rows / 4` — see `msl.rs`'s `packed_row_split_factor` and
# sized::PACKED_ROW_SPLIT_K_TARGET_SIMDGROUPS. The measured decode-graph
# table (this landing's own discipline row) shows GB/s rising monotonically
# with simdgroup count through at least 1024 (attn_q/attn_output/ffn_down);
# 2048 sits one step past that observed range, low enough that
# `max_split`(8) keeps every real starved shape (attn_k/attn_v at 256 base
# simdgroups) inside its cap rather than saturating it, high enough to move
# the two families the measured mechanism actually names as starved.
# `feature = "metal-q4k-split-k"`-only; emitted only when that feature is
# active.
target_simdgroups = 2048
# ceiling on the split factor — bounds the per-threadgroup thread count to
# `max_split * SIMD_WIDTH`(32) so `crate::metal::dispatch`'s
# `.min(max_threadgroup)` clamp (typically 1024 threads) never engages and
# silently shrinks the threadgroup out from under the grid-thread count
# `grid_threads` already committed to (`omega-runtime.toml`'s own
# `require_split_k_headroom` enforces `max_split * 32 <= 1024` at build
# time) — see sized::PACKED_ROW_SPLIT_K_MAX_SPLIT.
max_split = 8

[packed_row_multi_activation]
# maximum number of activation ("token") rows one simdgroup folds against a
# streamed weight row in the row-blocked packed matmul kernel's multi-row
# fold (`msl.rs`'s `push_packed_row_multi_row_body`, `push_packed_row_blocked_body`'s
# own `token_total > 1` branch) -- the register-tiling cap on `s`. Each
# streamed weight block's decode (header + nibble extract) happens ONCE per
# block iteration and is folded against every one of these activation rows
# in registers, so raising this amortizes weight streaming over more tokens
# but grows live registers roughly linearly: the activation gather alone is
# `group * 32` floats per lane (`Q4K_BLOCK_ELEMENTS / lanes_per_block`(32)
# elements per sub-block), plus `group * PACKED_ROWS_PER_GROUP`(4)
# accumulators. `token_total` above this cap is TILED at the grid level
# (`ceil(token_total / group)` simdgroup-groups along the token axis), not
# truncated -- see sized::PACKED_ROW_ACTIVATION_GROUP. Must be a power of
# two, <= 32 (an Apple GPU simdgroup's per-thread register file makes
# anything larger a spill hazard, the same ceiling
# `packed_row_block.simdgroups` enforces for occupancy). Overridable
# per-build via `OMEGA_PACKED_ROW_MULTI_ACTIVATION_GROUP`. Always emitted --
# the multi-row fold is unconditional, keyed off the concrete token extent
# `classify_packed_row_block` derives per op, not a compile feature.
group = 8

[elementwise]
# smallest element count at which an elementwise kernel decodes its linear thread
# index into coordinates with a float reciprocal and one integer correction
# (`msl::push_coordinate_decomposition`) instead of a runtime `%` and `/` per
# axis. Apple GPUs have no integer divider: each runtime divide is a long
# dependent multi-instruction sequence, and a rank-3 decode pays two divides and
# two modulos in every thread before its first load, so a grid of hundreds of
# thousands of threads is bound by that chain rather than by its memory
# traffic. Below this count the grid is latency-floor bound and keeps the
# integer form. The reciprocal form is exact for counts up to
# `msl::RECIPROCAL_DECOMPOSITION_MAX_ELEMENTS` (a float32 mantissa fact, not a
# policy). 0 admits every grid under that ceiling. Overridable per-build via
# `OMEGA_ELEMENTWISE_RECIPROCAL_MIN_ELEMENTS`.
reciprocal_min_elements = 65536

[spans]
# capacity of `metal::UNIFORM_BUFFERS`, the content-keyed cache of uploaded
# uniform-blob `MTLBuffer`s (see `metal.rs`'s `upload_uniforms` and
# sized::UNIFORM_CACHE_ENTRIES). The cache has no eviction below this
# landing, so any workload whose uniform bytes vary per call (different
# shapes, different `cached_len` without bucketing) grows it without bound —
# a plan-stable decode holds 57 entries after 3 steps (measured,
# `uniform_cache_len`), well under this default. Cost of raising it: one
# `MTLBuffer` per additional distinct uniform blob retained. Cost of
# lowering it below a plan's real distinct-blob count: LRU evicts entries
# still in rotation, turning cache hits into misses (a correctness-neutral,
# perf-only regression -- `upload_uniforms` re-uploads on a miss).
# Overridable per-build via `OMEGA_SPANS_UNIFORM_CACHE_ENTRIES`.
uniform_cache_entries = 4096

[command_buffer]
# ops in the FIRST command buffer of a chunked decode step. The GPU cannot
# start until the first buffer is committed, and committing needs every op in
# it encoded (~1.8 us per op, host-side), so an even split across K chunks
# delays GPU start by encode(total/K). A short head chunk starts the GPU after
# a fraction of that while the host encodes the remaining chunks behind it.
# Measured on gemma4-E2B decode (1150 ops, K=8, quiet box, text identical):
# even split 17.2-17.4 ms/token, a 16, 24, 32 or 40 op head then an even tail
# 17.1-17.2 ms/token -- the head size inside that range is not distinguishable.
# A geometric ramp after the head (32, 160, 800: fewer, larger chunks) measured
# 17.45 ms/token, worse than the even tail, so the tail stays even. Cost of
# raising the head: later GPU start; cost of lowering it: the next chunk's
# encode outlasts the head's GPU time. 0 restores the even split. Overridable
# per-build via `OMEGA_COMMAND_BUFFER_FIRST_CHUNK_OPS`.
first_chunk_ops = 24

# growth of each chunk after the head, in permille of the chunk before it: the
# ops after the head are split into K-1 chunks whose sizes form a geometric
# series with this ratio. 1000 is the even tail (with `first_chunk_ops = 24`,
# the schedule before this key existed). A chunk must run on the device at
# least as long as the next chunk takes to encode, so the ratio is bounded by
# device time per op over encode time per op. Measured on one decode step of
# two plans (`chunk_record` events, median-shaped step): the 24 op head ran
# 0.262 ms (10.9 us/op) and 0.273 ms (11.4 us/op); encoding the second chunk
# cost 7.1 us/op (116 ops) and 9.6 us/op (51 ops), ratios 1.54 and 1.19. The
# chunks after the second ran 10.0-16.4 us/op (first plan, chunks 3-7) and
# 12.7-15.3 us/op (second plan, chunks 3-8) on the device, ratios 1.41 and
# 1.33 at their lowest. 1350 sits just above the lowest (1.33) and puts the
# second chunk of the longer plan at about 40 ops, 0.28 ms to encode against
# the head's 0.262 ms. At 1000 that chunk was 116 and 51 ops, 0.823 and
# 0.488 ms to encode, leaving the device idle 0.552 and 0.212 ms. Cost of
# raising it: the last chunks grow, so the tail encodes longer behind a larger
# device buffer; cost of lowering it: the second chunk outlasts the head.
# Overridable per-build via `OMEGA_COMMAND_BUFFER_GROWTH_PERMILLE`.
growth_permille = 1350

[output_pool]
# per-`(bucket, dtype)` cap on retained buffers in `metal::OUTPUT_BUFFER_POOL`
# (`feature = "metal-buffer-pool"`-only) -- see sized::OUTPUT_POOL_MAX_PER_BUCKET
# and `metal.rs`'s own doc on the const this replaces. A safety net against a
# pathological program shape (many parallel same-size branches); steady
# decode never approaches it. Overridable per-build via
# `OMEGA_OUTPUT_POOL_MAX_PER_BUCKET`.
max_per_bucket = 8

[arena]
# CARD 6.5's memory gate (MG-3): the plan-owned transient-buffer arena's
# cap, in bytes (`feature = "metal-plan-stable-buffers"`-only) -- see
# sized::ARENA_TRANSIENT_CAP and `metal.rs`'s `build_buffer_arena`, which
# prints its own peak against this before returning; a peak above it is
# this card's own kill condition. Overridable per-build via
# `OMEGA_ARENA_TRANSIENT_CAP`.
transient_cap = 172_812_125

[wgsl]
# threads per workgroup every v1 WGSL kernel dispatches with -- see
# sized::WORKGROUP_SIZE and `wgsl.rs`'s own doc: any positive value is
# legal WGSL, 64 matches `crate::metal`'s own occupancy-driven default
# width for the non-cooperative (serial) kernels this module emits
# exclusively. Always emitted -- `wgsl.rs` is not feature-gated, unlike the
# `wgpu-backend`-only driver that consumes its output.
# Overridable per-build via `OMEGA_WGSL_WORKGROUP_SIZE`.
workgroup_size = 64

[attention_context_chunks]
# `render_cached_attention`'s key range, split across this many simdgroups
# per `(query_row, kv_head, group)` threadgroup -- llama.cpp's own
# `kernel_flash_attn_ext_vec` stride partition
# (ggml-metal.metal:4016-4017, `ic0 += C*nsg`), ported to this kernel's
# per-key loop (`C=1` here, since the body already iterates one key at a
# time rather than llama's KV-block width). `chunks =
# clamp(ceil(context_length / keys_per_chunk), 1, cap)` --
# `msl::context_chunks_for`. Raising `keys_per_chunk` lowers chunk count
# (less parallelism, less merge overhead); raising `cap` allows more
# simdgroups on long contexts at the cost of more `threadgroup` memory for
# the cross-simdgroup online-softmax merge. Overridable per-build via
# `OMEGA_ATTENTION_CONTEXT_CHUNKS_KEYS_PER_CHUNK` /
# `OMEGA_ATTENTION_CONTEXT_CHUNKS_CAP`.
keys_per_chunk = 16
cap = 4

[attention_block]
# `render_cached_attention`'s in-block staging width -- llama.cpp's own
# `kernel_flash_attn_ext_vec` keys-per-block constant `C` (ggml-metal.metal
# `:4016-4017`, `ic0 += C*nsg`), ported onto our per-simdgroup key walk. A
# block of `width` keys is staged into `threadgroup` memory (`ss[]`) and
# online-softmax-reduced ONCE per block (one `simd_max`/`simd_sum` pair),
# rather than once per key -- see `omega/src/msl.rs`'s `block_width_for` and
# ROW notes on `NumericRewrite::TreeReduce`. `width = 1` renders today's
# strictly-sequential per-key body, byte-for-byte -- the two are the same
# generated MSL text at `width = 1`, never a separate code path. `width` MUST
# be a multiple of 32 (SIMD_WIDTH): the online-softmax combine fires once
# per 32-lane sub-block (`simd_max`/`simd_sum` operate over the current 32
# lanes), and within each 32-lane sub-block the Q*K stage covers `NE = 4`
# concurrent keys per `cc` iteration (`ty = lane / 8` picks which of the 4).
# Overridable per-build via `OMEGA_ATTENTION_BLOCK_WIDTH`.
width = 32

[gated_delta_net]
# `render_gated_delta_net`'s per-thread register array size
# (`float state_row[head_k_dim_max]`) -- the fused kernel keeps one
# `head_k_dim`-long state row resident in registers across the whole
# `n_tokens` loop (design doc `fused-gdn-kernel.md` §2), so this cap bounds
# register pressure per thread the same way `ATTENTION_SPLIT_MAX` bounds
# dispatch width above. qwen35moe's real shape is `head_k_dim = 128`; 256
# leaves headroom for a wider head dim without recompiling the sizing
# config. A bind whose `head_k_dim` exceeds this cap is rejected at emit
# time (`EmitError::GatedDeltaNetHeadKDimExceedsCap`), never silently
# clamped. Overridable per-build via `OMEGA_GATED_DELTA_NET_HEAD_K_DIM_MAX`.
head_k_dim_max = 256

[attention_splits]
# `render_cached_attention`'s key range, split across this many THREADGROUPS
# per `(query_row, kv_head)` pair -- llama.cpp's own `nwg` (fixed 32,
# `ggml-metal-ops.cpp:3457-3466`), ported here as a live-length-derived
# count rather than a fixed one, because our threadgroup is heavier
# (cooperative `query_groups`-way K/V sharing across simdgroups) than
# llama's per-Q-head one.
#
# ROW 383: the divisor has a KNEE, because the mechanism is genuinely
# non-monotonic -- more splits helps at the tiny decode window (occupancy
# starved: normally only 1 threadgroup, so splitting buys free parallelism)
# AND at huge contexts (throughput-bound: enough work per split to amortize
# the merge-dispatch overhead), but HURTS in between (occupancy is already
# adequate at 4 splits, so a finer divisor only adds fixed per-split
# overhead -- 512 keys measured 170-177us at 8/16/32 splits, all within
# noise of each other, vs 89.5us at the old 4-split rule; ROW 383's own
# `omega/tests/row_376_cached_attention_batched.rs` cells).
# `keys_per_split = clamp(ceil(live_len / divisor), 1, max)` where
# `divisor = keys_per_split` (this key, small) below `keys_per_split_at_scale`
# and `divisor = keys_per_split_at_scale` (large) at or above it --
# `msl::splits_for`. Overridable per-build via
# `OMEGA_ATTENTION_SPLITS_KEYS_PER_SPLIT` /
# `OMEGA_ATTENTION_SPLITS_KEYS_PER_SPLIT_AT_SCALE` / `OMEGA_ATTENTION_SPLITS_MAX`.
# ROW 381: at the decode scoreboard window (capacity 39-78 keys) 16 measured
# 36.1us median vs the (then-only) divisor 128's 43.6us bare (beyond 2x CoV)
# by giving that window 3 threadgroups instead of 1.
# ROW 383: reinstates 128 as `keys_per_split_at_scale`, the ORIGINAL
# pre-ROW-381 divisor, for any context at or above it -- this is exactly the
# value ROW 381 measured winning at 512 keys (splits=4, 89.5us) and it
# already clamps to `max` at 4096 keys (splits=32) the same as the small
# divisor did, so nothing regresses at scale while the decode window keeps
# ROW 381's win.
keys_per_split = 16
keys_per_split_at_scale = 128
max = 32
# two-range decode split form (`msl::CachedAttentionForm::TwoRangeDecodeSplit`):
# keys per threadgroup split, llama.cpp's C = 32-key block
# (ggml-metal-impl.h:117). raising it gives fewer, longer serial chains per
# threadgroup; lowering it adds merge width. must be a multiple of
# [attention_block].width. override via
# OMEGA_ATTENTION_SPLITS_KEYS_PER_SPLIT_DECODE.
keys_per_split_decode = 32

[attention_decode]
# the decode split kernel's (`msl::CachedAttentionForm::TwoRangeDecodeSplit`)
# lane layout. A simdgroup walks `keys_in_flight` keys at once, each spread
# over `32 / keys_in_flight` lanes along the head dim, so a lane owns
# `head_dim / 8 / lanes` float4 of every K plane row and `head_dim / 4 / lanes`
# float4 of every V row. llama.cpp's `kernel_flash_attn_ext_vec` `NE`
# (ggml-metal.metal `NE = 4` baseline); 1 spans the whole simdgroup over one
# key, which makes the online-softmax state uniform across lanes (no per-block
# `simd_max`/`simd_sum`, no staged scores) and every K/V load a contiguous
# 512 B line. must be 1, 2 or 4. override via
# OMEGA_ATTENTION_DECODE_KEYS_IN_FLIGHT.
keys_in_flight = 1
# keys per lane group whose K and V loads are issued together before any of
# them is consumed. raising it lengthens the independent load run a lane has
# in flight (fewer memory round trips per simdgroup) and costs
# `batch * (head_dim / 8 / lanes * 2 + head_dim / 4 / lanes)` float4 registers;
# past the register file it spills or lowers occupancy. override via
# OMEGA_ATTENTION_DECODE_KEYS_PER_BATCH. 1 is the default because a probe sweep at
# the gemma4-E2B global shape measured 38.9 us per dispatch at (8 keys per
# simdgroup, batch 1) against 52.2 us at (16, 2); see occ RESULTS.md.
keys_per_batch = 1
# target live keys one simdgroup walks: simdgroups per threadgroup =
# clamp(ceil(keys_per_split / this), 1, simdgroups_max). lowering it spreads a
# split over more simdgroups, which shortens each one's serial memory chain at
# the cost of a wider threadgroup-memory merge. override via
# OMEGA_ATTENTION_DECODE_KEYS_PER_SIMDGROUP.
keys_per_simdgroup = 8
# ceiling on simdgroups per decode threadgroup. the threadgroup-memory merge
# holds `simdgroups_max * (head_dim * 4 + 8)` bytes, so
# `msl::decode_simdgroup_cap` also clamps it against
# `[cached_attention].threadgroup_memory_bytes`. must be a power of two <= 32.
# override via OMEGA_ATTENTION_DECODE_SIMDGROUPS_MAX.
simdgroups_max = 4

[attention_rows]
# row-tiled cached attention (`msl::CachedAttentionForm::TwoRangeRowTiled`, K > 1 query rows,
# speculative verify through whole-prompt prefill): the widest key block a threadgroup stages
# at once. llama.cpp's OP_FLASH_ATTN_EXT_NCPSG is 64 (ggml-metal-impl.h:114); 128 halves the
# barriers per key and lets a simdgroup score several key tiles against one query fragment
# load, at the cost of a score tile twice as wide. a form with fewer than 4 simdgroups takes
# 32 keys per simdgroup instead (`crate::msl::row_tiled_block`). must be a multiple of 32.
# override via OMEGA_ATTENTION_ROWS_KEYS_PER_BLOCK.
keys_per_block = 128
# keys one split of the cached range holds, at least: the bucket capacity over this is the
# split count a small K fans out to, up to the threadgroups `target_simdgroups` asks for.
# smaller than the block, so a verify of a few rows keeps the occupancy a 64-key slice gives
# while a prefill walks whole blocks. must be a multiple of 8. override via
# OMEGA_ATTENTION_ROWS_KEYS_PER_SPLIT.
keys_per_split = 64
# head dims per simdgroup: simdgroups = clamp(head_dim / this, min_simdgroups, 8), llama.cpp's
# `ne00 >= 512 ? 8 : 4` (ggml-metal-ops.cpp:3406) for head dims 256 and 512. must be a
# multiple of 8. override via OMEGA_ATTENTION_ROWS_HEAD_DIMS_PER_SIMDGROUP.
head_dims_per_simdgroup = 64
# fewest simdgroups a row-tiled threadgroup carries. one simdgroup walks the whole key block
# alone; two halve it at no cost in accumulators (head dim 64: 1454 us against 1094 us per
# layer at 1000 rows). override via OMEGA_ATTENTION_ROWS_MIN_SIMDGROUPS.
min_simdgroups = 2
# smallest K that takes the MMA form; below it K rows replicate the decode split body.
# must be >= 2 (K = 1 is always the decode split form). the crossover sweep moves this, not
# code. override via OMEGA_ATTENTION_ROWS_MMA_MIN_QUERY_ROWS.
mma_min_query_rows = 2
# 8x8 vector blocks a threadgroup shares each K and V fragment load across, when its query
# rows can fill the GPU with them. 2 is the measured knee on head dims 64, 256 and 512; one
# is faster at a verify of a few rows, where the extra block halves the threadgroups.
# override via OMEGA_ATTENTION_ROWS_VECTOR_BLOCKS_PER_TILE.
vector_blocks_per_tile = 2
# 8x8 output fragments one simdgroup keeps in registers across the whole key loop (head dims
# per simdgroup / 8 per vector block, times the vector blocks of a tile): the most a tile
# unit may need before the accumulators spill. override via
# OMEGA_ATTENTION_ROWS_ACCUMULATOR_FRAGMENTS.
accumulator_fragments = 16
# simdgroups in flight the split rule fills to (threadgroups = this over the form's simdgroups
# per threadgroup). measured on one device: the fastest tile and split of a verify or chunk of
# 8 to 128 rows lands on 256 simdgroups on head dim 512 (8 simdgroups, 32 threadgroups) and on
# head dim 64 (2 simdgroups, 128 threadgroups); head dim 256 (4 simdgroups) is fastest near 384
# and up to 26 percent slower at 256 (32 rows). a device with a different resident-simdgroup
# capacity moves this, not code. must be nonzero. override via
# OMEGA_ATTENTION_ROWS_TARGET_SIMDGROUPS.
target_simdgroups = 256
# most threadgroup bytes the staged query tile may take (the tile also has to fit beside the
# score tile in `[cached_attention].threadgroup_memory_bytes`). staging pays one global read
# of the query tile per threadgroup instead of one per key block, and costs threadgroup bytes
# the occupancy of the GPU spends on resident threadgroups. MEASURED (1000-token prefill
# attention, head dim 64, 5120 staged bytes): staging is 36 us/op faster. Sliding head dim
# 256, 17408 staged bytes: staging is about 181 us/op slower. 8192 stages the first shape and
# not the second; the full `threadgroup_memory_bytes` value stages every shape
# that fits. override via OMEGA_ATTENTION_ROWS_MAX_STAGED_QUERY_BYTES.
max_staged_query_bytes = 8192

[selection]
# smallest row count at which the rank-count top-fraction expression lowers to one selection
# kernel instead of the O(M^2) plain expression. below it the plain expression runs.
# 256 is unmeasured (plausible, not proven): at 256 rows the plain expression is 65,536
# compare-adds. raising it keeps the plain expression longer; lowering it launches the
# kernel for smaller inputs. must be nonzero. override via OMEGA_SELECTION_TOP_FRACTION_MIN_ROWS.
top_fraction_min_rows = 256

[cached_attention]
# Metal's per-threadgroup `threadgroup` memory ceiling on every GPU family
# this crate targets -- `render_cached_attention`'s single-range dynamic
# path declares `shared_m`/`shared_l`/`shared_o` sized off `query_groups *
# effective_cap * (head_dim + 2) * 4` bytes (`msl::effective_context_chunk_
# cap`'s own doc), and a shape whose uncapped `[attention_context_chunks]
# .cap` blows this ceiling fails Metal pipeline compilation outright
# (`CompileFailed`) rather than degrading. `maxThreadgroupMemoryLength`
# reports this same 32768 on every Apple Silicon family to date; there is
# no per-device query wired into this build step, so the fallback constant
# below is also today's only source. Overridable per-build via
# `OMEGA_CACHED_ATTENTION_THREADGROUP_MEMORY_BYTES`.
threadgroup_memory_bytes = 32768

[packed_row_nsg]
# `tiled_gemm_threadgroup_width`'s nsg multiplier for the packed
# row-blocked path, shared by `metal-packed-row-nsg2` and
# `metal-q4k-ggml-port` (either feature emits this; both want the
# identical value) -- see sized::PACKED_ROW_NSG and `msl.rs`'s
# `packed_row_nsg_factor`. ggml's own `N_SG_Q4_K` is 2; must be a power of
# two and `<= 32` for the same reason `packed_row_block.simdgroups` is.
# Overridable per-build via `OMEGA_PACKED_ROW_NSG_WIDTH`.
width = 2

[load_time_fit]
# `proxima-model-interop`'s own load-time memory-fit gate reads these two
# constants (via `omega::sized::LOAD_TIME_FIT_OS_HEADROOM_BYTES` /
# `..._ARENA_ALLOWANCE_BYTES`) rather than hard-coding either — this crate
# has no OS-facing runtime knowledge of its own, `omega` is the one crate
# every GPU-backed build already links for device facts
# (`metal::system_memory_facts`), so its own sizing toml is where a
# byte-budget constant belongs (principle 12: no magic numbers in source).

# Bytes of slack reserved for the OS and every other process on this host,
# subtracted from `min(recommendedMaxWorkingSetSize, hw.memsize)` before a
# checkpoint's own budget (file bytes + placed-KV + arena allowance) is
# compared against the limit. 8 GiB is a conservative default for a
# desktop/workstation host running a browser and IDE alongside a serving
# process -- override lower on a headless box via
# `OMEGA_LOAD_TIME_FIT_OS_HEADROOM_BYTES`.
os_headroom_bytes = 8_589_934_592

# The largest measured `BufferArena` peak across every step in
# `proxima-tensor/docs/discipline.md` ROW 391's own per-step device-memory
# table (~27 MB, the arena's transient per-op output/uniform/fault-buffer
# allocation that `emit_device_memory_by_class`'s own doc says is never
# separately sized) -- a fixed allowance rather than a live measurement
# because the arena's real peak is only known AFTER a forward runs, and this
# budget must be computed BEFORE the first weight upload.
arena_allowance_bytes = 28_311_552

# Bytes of `BufferArena` peak one prefill row adds on top of `arena_allowance_bytes`,
# multiplied by `ServingConfig::ubatch_size` (the most rows one prefill evaluation
# carries) by `proxima-model-interop`'s fit gate. The arena's own cap scales with the
# bind-time row count (`arena.transient_cap` times rows), and so must the load-time
# budget that predicts it. Worst witness: the ROW 391 incident, a 1100-row prefill whose
# naive no-reuse peak was 984_110_552 bytes (`omega/src/metal/arena_encode_dispatch_finish.rs`
# `thousand_row_prefill_shape_fits_the_scaled_cap`), ceil(984_110_552 / 1100) = 894_647;
# the 1618-row witness on a 35-layer decoder is 495_315_984 bytes, 306_135 per row. Not covered:
# the unfused two-range attention score tensors, which scale with cached keys as well as
# rows. 0 restores the fixed allowance. Overridable per-build via
# `OMEGA_LOAD_TIME_FIT_ARENA_BYTES_PER_PREFILL_ROW`.
arena_bytes_per_prefill_row = 894_647

[grid]
# widest 1D grid, in threads, a Metal kernel's `uint gid
# [[thread_position_in_grid]]` can address. A dispatch wider than this launches
# only `threads mod 2^32` of them -- the tail outputs are never written and
# read back as zeros with no driver error -- so `msl::grid2d_for` renders any
# kernel whose grid exceeds it in the flat 2D form instead (a 64-bit global
# index rebuilt from `threadgroup_position_in_grid`, dispatched with
# `dispatchThreadgroups`). The hardware fact is 4294967295 (`u32::MAX`) and
# the build rejects anything above it; lowering it is how a test build makes
# every kernel take the wide form on a small shape. Overridable per-build via
# `OMEGA_GRID_LINEAR_THREAD_LIMIT`.
linear_thread_limit = 4294967295

# most threadgroups the flat 2D form places on its x axis before spilling
# whole threadgroups into y (`msl::grid2d_for`). Kernels rebuild the linear
# threadgroup index as `y * threadgroups_per_grid.x + x`, so the split never
# changes which thread computes which element. Overridable per-build via
# `OMEGA_GRID_MAX_THREADGROUPS_X`.
max_threadgroups_x = 65535
