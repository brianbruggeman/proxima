[package]
name = "proxima-cli"
description = "Command-line interface for proxima: call, serve, describe, daemon control, hot-swap, verification, replay, and pipeline commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
name = "proxima_cli"
path = "src/lib.rs"

[[bin]]
name = "proxima"
path = "src/main.rs"

[[bin]]
name = "proximad"
path = "src/daemon.rs"

[dependencies]
proxima = { workspace = true, features = ["runtime-tokio", "tokio", "http1-native", "http1"] }
clap = { workspace = true, features = ["derive", "env"] }
mimalloc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "process", "macros"] }
postcard = { workspace = true, features = ["alloc"] }
toml.workspace = true
futures.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
proxima-telemetry = { workspace = true, features = ["emit", "std"] }
proxima-model-interop = { version = "0.1.0", path = "../../proxima-model-interop", features = ["std"] }
proxima-tensor = { workspace = true, features = ["std", "config"] }
proxima-safetensors = { version = "0.1.0", path = "../../proxima-safetensors" }

[dev-dependencies]
proxima = { workspace = true, features = ["test-support-tokio"] }
tempfile.workspace = true
time.workspace = true
bytes.workspace = true
proxima-tensor = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
