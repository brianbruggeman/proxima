# excluded from the host workspace (`Cargo.toml`'s `workspace.exclude`) since
# this is a bare no_std, no_alloc aarch64-unknown-none binary that a plain
# `cargo build --workspace` on the host cannot compile; the empty table below
# makes this its own workspace root, as cargo itself suggests for an excluded
# path that has no in-tree workspace of its own.
[workspace]

[package]
name = "proxima-vm-guest-lambda"
description = "bare no_std, no_alloc guest binary proxima-vm's ELF loader boots: fixed-address entry point, no hypercall ABI wired yet"
# this crate is its own workspace root (see [workspace] above), so it cannot
# inherit `workspace.package` from the host root Cargo.toml; these mirror
# that root's values verbatim and must be kept in sync by hand.
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brianbruggeman/proxima"
homepage = "https://github.com/brianbruggeman/proxima"
publish = false

[[bin]]
name = "proxima-vm-guest-lambda"
path = "src/main.rs"

# M5b PSCI slice: a deliberately separate guest from `proxima-vm-guest-lambda`
# above so its `hvc` call sequence never perturbs that binary's own pinned
# ELF layout (`src/elf.rs::matches_readelf_on_the_real_aarch64_guest`) or its
# pinned emitted-byte contract (`tests/dispatch_hypercall.rs`).
[[bin]]
name = "proxima-vm-guest-lambda-psci"
path = "src/bin/psci_probe.rs"

# M5b GIC slice 3: another deliberately separate guest, same isolation
# reason as the psci probe above, so this GICD/GICR register-read sequence
# never perturbs either sibling binary's pinned ELF layout or emitted-byte
# contract.
[[bin]]
name = "proxima-vm-guest-lambda-gic"
path = "src/bin/gic_probe.rs"

# M5b pl011 slice: another deliberately separate guest, same isolation
# reason as the psci/gic probes above, so this UARTDR write sequence never
# perturbs either sibling binary's pinned ELF layout or emitted-byte
# contract.
[[bin]]
name = "proxima-vm-guest-lambda-pl011"
path = "src/bin/pl011_probe.rs"

# mirrors the host workspace's [workspace.lints] (see root Cargo.toml);
# `workspace = true` is unavailable since this crate is its own workspace root
[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
