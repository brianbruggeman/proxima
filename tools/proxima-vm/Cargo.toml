[package]
name = "proxima-vm"
description = "Minimal VM-backed proxima Pipe proof surface for scratch guests over KVM or Hypervisor.framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE*"]

[features]
default = ["std"]
# proxima-primitives::pipe alloc tier drags in proxima-primitives::transport
# -> parking_lot (no no_std path)
std = ["alloc", "futures/executor", "dep:proxima-primitives", "proxima-primitives/std", "dep:proxima-process", "dep:cpio", "thiserror/std", "dep:kvm-ioctls", "dep:kvm-bindings", "dep:libc", "dep:proxima-listen", "dep:proxima-runtime", "dep:proxima-telemetry", "dep:tar", "dep:flate2", "dep:sha2", "dep:http", "dep:prime", "dep:proxima-http", "dep:serde_json", "proxima-net/frame-stack", "proxima-protocols/http1_codec"]
# `dtb::builder` needs `Vec<u8>` (vm-fdt's writer); the parser half
# (`fdt` crate) is genuinely tier-3 and would build without this, but the
# module is one file so it shares the alloc gate.
alloc = ["dep:vm-fdt"]
# Gates `benches/bench_elf.rs` (object/goblin compare-bench). Default-off per
# the disciplined-component gate 1: `object`/`goblin` never build for a plain
# `cargo build`/`cargo test`, only `cargo bench --features elf-bench`.
elf-bench = []
proxima-onnx = ["dep:proxima-onnx"]
proxima-tensor = ["dep:proxima-tensor"]
# Gates `restore_to_inference_probe` (mapped-weights-restore-to-first-logit
# demo) -- pulls proxima-onnx + proxima-tensor into this crate's dependency
# graph, which a normal `cargo build`/`cargo test` on this VM-only crate
# should never pay for, the same reasoning `wire-to-weights-demo`
# (root `Cargo.toml`) already applies to the same two crates.
restore-probe-demo = ["std", "proxima-onnx", "proxima-tensor"]
# Opt-in real-VM boot tests (kernel_boot, kernel_boot_userspace, edk2_boot):
# with it on, an unset asset env var is a hard failure, never a silent pass.
kernel-boot = ["std"]
# Opt-in tests that reach docker hub: the default suite never touches the network.
oci-network = ["std"]

[dependencies]
arrayvec.workspace = true
bytes.workspace = true
cpio = { version = "0.4.1", optional = true }
crossbeam-queue.workspace = true
fdt = "0.1.5"
flate2 = { version = "1.1.10", optional = true }
futures.workspace = true
http = { workspace = true, optional = true }
postcard = { workspace = true, features = ["alloc"] }
prime = { workspace = true, optional = true }
proxima-core = { workspace = true, features = ["alloc"] }
proxima-http = { workspace = true, features = ["http1-stream-client"], optional = true }
proxima-listen = { workspace = true, optional = true }
proxima-net = { version = "0.1.0", path = "../../proxima-net", default-features = false, features = ["alloc"] }
proxima-onnx = { version = "0.1.0", path = "../../proxima-onnx", default-features = false, features = ["std"], optional = true }
proxima-primitives = { workspace = true, features = ["alloc"], optional = true }
proxima-process = { workspace = true, features = ["alloc"], optional = true }
proxima-protocols = { workspace = true, features = ["process", "nvme", "virtio"] }
proxima-runtime = { workspace = true, optional = true }
proxima-telemetry = { workspace = true, features = ["emit"], optional = true }
proxima-tensor = { version = "0.1.0", path = "../../proxima-tensor", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { version = "0.4.46", optional = true }
thiserror.workspace = true
vm-fdt = { version = "0.3.0", default-features = false, features = ["alloc"], optional = true }

[[bin]]
name = "hello"
required-features = ["std"]

# every probe below drives std-gated surface (dispatch::run_dispatch_loop,
# snapshot::*, boot::*) directly, so each needs the same required-features
# gate `hello` already carries -- otherwise `cargo build --no-default-features
# --features alloc` tries to build them and fails on items that were
# correctly configured out.
[[bin]]
name = "cow_primitives_probe"
required-features = ["std"]

[[bin]]
name = "dispatch_probe"
required-features = ["std"]

[[bin]]
name = "edk2_boot_probe"
required-features = ["std"]

[[bin]]
name = "kernel_boot_probe"
required-features = ["std"]

[[bin]]
name = "proxima-vm"
required-features = ["std"]

[[bin]]
name = "snapshot_capture_probe"
required-features = ["std"]

[[bin]]
name = "snapshot_layered_probe"
required-features = ["std"]

[[bin]]
name = "snapshot_restore_probe"
required-features = ["std"]

[[bin]]
name = "snapshot_warm_restore_probe"
required-features = ["std"]

[[bin]]
name = "restore_to_inference_probe"
required-features = ["restore-probe-demo"]

[[test]]
name = "kernel_boot"
required-features = ["std", "kernel-boot"]

[[test]]
name = "kernel_boot_userspace"
required-features = ["std", "kernel-boot"]

[[test]]
name = "edk2_boot"
required-features = ["std", "kernel-boot"]

[[test]]
name = "oci_network"
required-features = ["std", "oci-network"]

[[bench]]
name = "bench_elf"
harness = false
required-features = ["elf-bench"]

[[bench]]
name = "bench_warm_restore_sweep"
harness = false
required-features = ["std"]

[lints]
workspace = true

[build-dependencies]
cc = "1.2.62"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
goblin = "0.10.7"
object = "0.40.0"
proptest.workspace = true
proxima = { package = "proxima-lib", path = "../..", features = ["test-support"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-icmp"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
kvm-bindings = { version = "0.14.2", optional = true }
kvm-ioctls = { version = "0.25.1", optional = true }
libc = { workspace = true, optional = true }

[[bench]]
name = "bench_frame_pipe"
harness = false
required-features = ["std"]

[[bench]]
name = "bench_virtio_net_queue"
harness = false
required-features = ["std"]
