[package]
name = "llama-arm"
version = "0.1.0"
edition = "2024"
publish = false
description = "bench-only arm that loads the incumbent's prebuilt libllama behind a sha256 and build-number gate; never a dependency of proxima"

# own workspace and lockfile: llama.cpp must not reach the root Cargo.lock
[workspace]

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
bindgen = { version = "0.73.2", optional = true }
libloading = "0.9.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[features]
bindgen = ["dep:bindgen"]

[[bin]]
name = "regen_bindings"
path = "src/bin/regen_bindings.rs"
required-features = ["bindgen"]
