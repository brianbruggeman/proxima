[package]
name = "proxima-numeric"
description = "The one place this workspace defines, describes or converts a number: `FloatLayout` scalars, `BlockLayout` quantized blocks, explicit level sets, and `Numeric`, the value that carries its format and converts across every one of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

conflaguration = { workspace = true, features = ["derive"], optional = true }
libm = { version = "0.2.16", default-features = false }

[features]
default = ["std"]
# tier 1: no_std + alloc. no path in this crate allocates, so the surface is
# identical to bare no_std minus nothing.
alloc = []
# tier 2: std-only conveniences.
std = ["alloc"]
# config surface for `NumericPolicy` / `Numerics`: conflaguration `Settings`.
config = ["std", "dep:conflaguration"]

[lints]
workspace = true

[dev-dependencies]
half = { version = "2.7.1", default-features = false }
serde_json.workspace = true
toml.workspace = true
