optional = ["rope_freqs.weight"]
# tensors the text graph never reads: the mtmd vision tower and projector
# (llama.cpp tools/mtmd/clip-impl.h: "v.patch_embd.weight" :107, "v.blk.%d.*" :383,
# "mm.%d.%s" :137, "mm.merger.fc1.%s" :153) and the HF-style multi-token
# prediction head (qwen35 "mtp.*", not executed in the main pass,
# src/models/qwen35.cpp:154)
unread_prefixes = ["v.", "mm.", "mtp."]

[[alias]]
kind = "rename"
leaf = "output.weight"
from = "token_embd.weight"

[[alias]]
kind = "part"
leaf = "ffn_gate_exps.weight"
from = "ffn_gate_up_exps.weight"
part = 0
of = 2

[[alias]]
kind = "part"
leaf = "ffn_up_exps.weight"
from = "ffn_gate_up_exps.weight"
part = 1
of = 2

[[alias]]
kind = "join"
leaf = "ffn_gate_up.weight"
from = ["ffn_gate.weight", "ffn_up.weight"]

[[alias]]
kind = "join"
leaf = "attn_qkv.weight"
from = ["attn_q.weight", "attn_k.weight", "attn_v.weight"]
