# the facts no checkpoint carries, one section per `general.architecture` (GGUF)
# or `model_type` (HF). Only what inference leaves unresolved appears here:
# activation, rope_layout, value_norm, score_scale_inverse_sqrt_head_dim, and
# embedding_scale / routed_gating where the header omits the key. Values are
# copied from the per-family rows this table replaces. A value that contradicts
# what the file shows is refused at load, never applied.
#
# ssm_v_head_reordered is the value for a recurrent header that omits the key.
# embedding_scale spells "None", "Sqrt" or { Factor = f32 }.

# source: llama.cpp rev f1ea20621. NORM pairs src/llama-model.cpp:3018, silu
# src/models/granite.cpp:269, no V norm. The header carries embedding_scale.
[granite]
activation = "Silu"
rope_layout = "adjacent"
value_norm = false
score_scale_inverse_sqrt_head_dim = true
routed_gating = "Softmax"

[granitemoe]
activation = "Silu"
rope_layout = "adjacent"
value_norm = false
score_scale_inverse_sqrt_head_dim = true
routed_gating = "Softmax"

# source: llama.cpp rev f1ea20621. NORM pairs src/llama-model.cpp:3018-3022, silu
