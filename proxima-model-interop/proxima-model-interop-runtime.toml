# Build-time sizing config for this crate's own driver policy
# (guiding-principle 12). See `src/sized.rs`'s own doc for the
# TOML -> build.rs -> generated-module chain and the
# `PROXIMA_MODEL_INTEROP_<SECTION>_<KEY>` env override every key here
# accepts.

[kv]
# plan-cache key bucket for the KV extent on the placed-KV Metal decode path
# (`generate::run_decode_loop_placed_kv`). The true `merged_len`
# (cached_len + new_count) strictly increases every decode step, so keying
# the Metal plan cache on it directly forces a re-plan (prepare + op-setup)
# on EVERY step; rounding up to this many tokens keeps the plan-cache key --
# and the KV `Op::Input` leaves' `Extent::Symbolic(1)` extent they bind
# against -- constant across a whole bucket of steps, at the cost of
# computing attention over `bucket - merged_len` padded (always-masked) key
# positions per step. `kv-capacity-bucket`-only: never emitted, and
# `sized::KV_BUCKET_TOKENS` never referenced, unless that feature is on.
# See `sized::KV_BUCKET_TOKENS` and CARD 6.3's sweep for the
# padding-vs-orchestration trade this value tunes. 32 is the 2026-09-04
# quiet round 1 winner: wall 40.89 vs off 42.54 ms/token, hits 5/8 (64 also
# wins at 41.18/hits 6/8; 256 loses at 48.18 -- ROW 273 has the full table).
# Moved here from `proxima-tensor-runtime.toml` (this crate is the sole
# consumer of the policy; the IR crate should not carry driver cache
# policy) without changing the value.
bucket_tokens = 32
