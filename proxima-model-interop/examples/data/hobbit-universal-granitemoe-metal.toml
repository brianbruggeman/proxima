context_length = 512
batch_size = 32
ubatch_size = 32
temperature = 0.0
top_k = 0
top_p = 1.0
min_p = 0.0
seed = 1
ignore_eos = true

[hobbit]
calibration_prompts = [
  "The quick brown fox jumps over the lazy dog.",
  "Precision is chosen per layer by measuring what each layer changes.",
]
max_calibration_tokens = 16

[moe_expert_precision]
enabled = true
high_threshold = 0.6
low_codec = "q4_k"
low_expert_ppm = 250000
held_out_prompts = [
  "A held-out sentence the plan was not ranked on, used only for quality.",
]

[moe_expert_precision.quality]
max_mean_kl = 0.10
min_top1_agreement = 0.85
