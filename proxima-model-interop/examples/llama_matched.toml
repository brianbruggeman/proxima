batch_size = 2048
ubatch_size = 512
kv_cache_key_quant = "f16"
kv_cache_value_quant = "f16"
attention_decomposition = "flash_where_admitted"
seed = 1
ignore_eos = true
gpu_layers = -1

# llama.cpp quantizes activations for quantized weights on cuda only (ggml-cuda mmvq: x/d up to
# MMVQ_MAX_BATCH_SIZE rows, mmq above); its metal backend does not. selected by --backend, no other entry.
[backend.cuda.numeric_policy]
activation_quantization = true
reciprocal_activation_scale_above_rows = 8

# no layer is offloaded on cpu: llama gets -ngl 0 and proxima loads on the host. selected by --backend.
[backend.cpu]
gpu_layers = 0
incumbent_device = ""

# the device-name prefix llama's own --list-devices must show for this backend (empty: llama runs every op on the
# cpu with -dev none). the harness refuses a llama that lists no such device. selected by --backend.
[backend.metal]
incumbent_device = "MTL"

[backend.cuda]
incumbent_device = "CUDA"
