# the reference dumps the patched sd-cli writes; the names are that tool's contract, so
# they live here and the tests look them up by key. an entry named "*" is the pattern for
# every key a section does not list, with {name} replaced by the key.

[dumps]
noise = "noise.f32"
text = "text.f32"
velocity1 = "velocity1.f32"
step1 = "step1.f32"
step2 = "step2.f32"
step3 = "step3.f32"
step4 = "step4.f32"
vae_out = "vae_out.f32"

[traces]
"*" = "p_{name}.f32"

# parity tolerances, read in the measured value's own type
[tolerances]
philox = "1e-5"
