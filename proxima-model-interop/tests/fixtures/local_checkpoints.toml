# host-local decoder-only checkpoints the differential reads (headers only).
# `dirs` are relative to $HOME and hold .gguf files; `library` names entries of
# a local model store whose model-layer blob is resolved from its manifests.
manifests = ".ollama/models/manifests/registry.ollama.ai/library"
blobs = ".ollama/models/blobs"
model_layer = "application/vnd.ollama.image.model"
dirs = [
    "models/granite-4.0-350m",
    "models/LFM2-350M",
    "models/Llama-3.2-1B-Instruct",
    "models/llm/flint-gguf",
]
library = ["gemma3", "gemma4", "granite3.1-moe", "qwen2.5", "qwen3", "qwen3.5"]

# the facts no file states, per `general.architecture`: what a TOML must supply
# or a probe must settle. The differential asserts each checkpoint leaves
# exactly these open, so a new gap or a closed one is visible, not silent.
[unresolved]
granite = ["activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
granitemoe = ["routed_gating", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
lfm2 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
llama = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
flint = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
gemma3 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
gemma4 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
qwen2 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
qwen3 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]
qwen35 = ["embedding_scale", "activation", "score_scale_inverse_sqrt_head_dim", "value_norm", "rope_layout"]

# architectures the serving tests single out by `general.architecture`
[named]
# no per-family row exists for it, so only the inferred profile describes it
without_a_row = "gemma3"
# its header states embedding_scale, so a contradicting fact is refused
states_embedding_scale = "granite"
