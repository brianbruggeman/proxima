# granite 3.1 1b-a400m (ollama granite3.1-moe:1b), written field by field from the published
# architecture: https://huggingface.co/ibm-granite/granite-3.1-1b-a400m-instruct/raw/main/config.json
#   hidden_size 1024, intermediate_size 512 (width of each of the 32 experts), num_attention_heads 16
#   (head width 1024 / 16), num_key_value_heads 8, num_hidden_layers 24, num_local_experts 32,
#   num_experts_per_tok 8, vocab_size 49155, hidden_act silu, attention_bias false,
#   embedding_multiplier 12.0, attention_multiplier 0.015625, residual_multiplier 0.22,
#   logits_scaling 6.0. config.json says nothing of the rotary pairing; HF computes rotate_half
#   (split-half), but the ollama GGUF's q/k rows are permuted to consecutive pairs by llama.cpp's
#   converter (conversion/llama.py undo_permute, inherited by GraniteMoeModel), so over those
#   weights the pairing is Interleaved. the engine choices at the end
#   (cache strategy, head repeats, last row) are not architecture and have no config.json key.
vocab = 49155
embedding = 1024
feed_forward = 512
expert_feed_forward = 512
query_heads = 16
block_count = 24
expert_count = 32
expert_used_count = 8
leading_dense_block_count = 24
l_cache = 0
embedding_scale = { Factor = 12.0 }
logit_scale = 6.0
residual_scale = 0.22
qk_norm = false
qkv_biases = false
paired_gate_up_reduce = false
fused_qkv_reduce = false
sliding_kv_ring = false
cache_strategy = "SingleRange"
head_repeats = 1
last_row_only = true

[[layers]]
repeat = 24
kind = "Attention"

[layers.attention]
head_dim = 64
kv_heads = 8
value_source_kind = "ProjectedV"
key_source_kind = "ProjectedK"
value_norm = false
score_scale = { Factor = 0.015625 }
rope_table = { cos_name = "rope_cos", sin_name = "rope_sin" }
rope_pairing = "Interleaved"

[layers.ffn]
post_attention_norm = false
combination = "Exclusive"
output_scale = false
routed_gating = "Softmax"
routed_expert_bias = false
activation = "Silu"
exclusive_dense_post_norm = false
ple = false
