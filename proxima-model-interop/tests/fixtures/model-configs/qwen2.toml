# qwen2.5 0.5b (ollama qwen2.5:0.5b), written field by field from the published architecture:
# https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/raw/main/config.json
#   hidden_size 896, intermediate_size 4864, num_attention_heads 14 (head width 896 / 14 = 64),
#   num_key_value_heads 2, num_hidden_layers 24, vocab_size 151936, hidden_act silu,
#   use_sliding_window false (no window), tie_word_embeddings true. config.json has no key for the
#   q/k/v biases (Qwen2Attention always has them) or the rotary pairing (rotate_half, split-half);
#   both are written from the model code. the engine choices at the end (cache strategy, head
#   repeats, last row) are not architecture.
vocab = 151936
embedding = 896
feed_forward = 4864
expert_feed_forward = 4864
query_heads = 14
block_count = 24
expert_count = 0
expert_used_count = 0
leading_dense_block_count = 24
l_cache = 0
qk_norm = false
qkv_biases = true
paired_gate_up_reduce = false
fused_qkv_reduce = false
sliding_kv_ring = false
cache_strategy = "Cached"
cache_mask = "Bounded"
head_repeats = 1
last_row_only = true

[[layers]]
repeat = 24
kind = "Attention"

[layers.attention]
head_dim = 64
kv_heads = 2
value_source_kind = "ProjectedV"
key_source_kind = "ProjectedK"
value_norm = false
score_scale = { InverseSqrtQueryPreAttnScalar = 64 }
rope_table = { cos_name = "rope_cos", sin_name = "rope_sin" }
rope_pairing = { SplitHalf = { pairs = 32 } }

[layers.ffn]
post_attention_norm = false
combination = "Exclusive"
output_scale = false
routed_gating = "Softmax"
routed_expert_bias = false
activation = "Silu"
exclusive_dense_post_norm = false
ple = false
