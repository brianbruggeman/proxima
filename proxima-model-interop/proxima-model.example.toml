# Model-level runtime policy. Copy to `proxima-model.toml` (what
# `policy::discover` looks for in the working directory) or point
# `PROXIMA_MODEL_CONFIG` at it.
#
# This file is the map of a llama.cpp invocation onto this stack. ONE key
# below is wired; the rest are knobs whose machinery does not exist yet, and
# setting one panics with a `todo!` that names what is missing and where it
# attaches (see src/policy.rs). They are listed rather than omitted so the
# gap is greppable instead of tribal.

# WIRED. Warm every page of the mapped GGUF before the first forward.
# Replaces the removed `PROXIMA_PREFAULT` environment read; the environment
# key is now PROXIMA_MODEL_PREFAULT (requires --features config).
prefault = false

# NOT IMPLEMENTED -- llama.cpp -c. No context window exists: one forward, one
# position, sequence length enters per call as the symbolic extent `?0`.
# context_length = 131072

# NOT IMPLEMENTED -- llama.cpp -b / -ub. No batching concept: every matmul is
# batch-1, which is why the row split chunks weight rows.
# batch_tokens = 32
# micro_batch_tokens = 32

# NOT IMPLEMENTED -- llama.cpp -fa. Attention is emitted as separate scale /
# softmax / matmul nodes, so the scores matrix is materialized in full.
# flash_attention = true

# NOT IMPLEMENTED -- llama.cpp -ctk / -ctv. There is no KV cache to quantize;
# the quantizers themselves already ship and are measured.
# kv_cache_key_dtype = "q8_0"
# kv_cache_value_dtype = "q8_0"

# NOT IMPLEMENTED -- llama.cpp -ngl / --no-kv-offload. omega::metal::execute
# takes `blocks: &[&[f32]]` and cannot accept packed quantized weights.
# gpu_layers = 99
# kv_offload = false

# NOT IMPLEMENTED -- llama.cpp --reasoning-budget. There is no generation
# loop: the harness runs one forward and greedy-picks one token.
# reasoning_budget_tokens = 1024
