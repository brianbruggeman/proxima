[package]
name = "proxima-model-interop"
description = "Sans-IO GGUF <-> safetensors transform over the format's common denominator (named tensors, dtype, shape, bytes); explicit about what each direction loses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
# strictly additive over the alloc-tier floor (guiding-principle 3): opens
# proxima-gguf's `edge::read_file` (whole-file IO) and proxima-tensor's
# `cpu` interpreter (both std-gated in their own crates) so this crate's
# gguf-tensor-by-name bind can be driven end to end through evaluation.
# The bind function itself (`bind::gguf_tensor_as_f32`) needs neither and
# stays available at the no_std+alloc floor either way.
# `proxima-tensor/config` is not optional here: `generate.rs` is a LIB module
# (`#[cfg(feature = "std")] mod generate`) and imports `proxima_tensor::spec`,
# which is `config`-gated. Until this line, `config` only ever arrived through
# [dev-dependencies], so `cargo build -p proxima-model-interop --features std`
# failed while `cargo test` passed — the dev-dep unified the feature in and hid
# it. A lib that only builds when its own tests are built is a broken lib.
std = [
    "proxima-gguf/std",
    "proxima-tensor/std",
    "proxima-tensor/config",
    "interop-bgpool",
    "dep:proxima-tokenizer",
    "dep:fastrand",
    "memmap2",
]
# split from `std` the same way proxima-tensor splits `tensor-bgpool`
# (proxima-tensor/Cargo.toml:45): `dep:prime` pulls in OS threads, so it
# stays out of the alloc-only floor even though every current `std` build
# wants it (loader::prefault is the only std-gated consumer today).
interop-bgpool = ["dep:prime", "dep:proxima-core"]
# passthrough to `proxima-tensor/instrument` -- opt-in so the acceptance
# forward-pass test (`bind::real_openchat_file`) can also be built and run
# WITHOUT the per-chunk/per-node tick counters compiled in at all, to answer
# whether the instrumentation itself is part of what gets measured.
# `omega?/instrument` (the `?` skips the passthrough when `omega` itself is
# not a dependency, i.e. the `metal` feature is off) turns on the split-4019
# per-token attribution counters in `omega::metal` alongside this crate's own
# generate.rs-side ones, so a single feature flag lights up both halves of
# the decode-loop split rather than needing two.
instrument = ["proxima-tensor/instrument", "omega?/instrument", "dep:proxima-telemetry", "proxima-telemetry/macros", "proxima-telemetry/std"]
# Metal decode path (macOS + Metal only). `generate.rs`'s decode loop runs
# the cached forward through `omega::backend::plan_named`/`execute_plan_named`
# instead of `proxima_tensor::cpu::evaluate_quantized_named_with_scratch`
# directly, backend selected at runtime via `ServingConfig::gpu_layers`
# (`serving.rs`). `cpu` is turned on alongside `metal` so `omega::backend`'s
# `Backend::Cpu` arm is also compiled in this build -- the decode loop routes
# BOTH backends through the same `omega::backend` entry point rather than
# keeping a direct `proxima_tensor::cpu` call for one of them. `omega`'s own
# `metal` feature already confines every objc2/Metal dependency to a
# `target_os = "macos"` section, so this feature alone never links a Metal
# framework off Apple hardware; any future call site into `omega::metal`
# must additionally gate on `target_os = "macos"` directly, matching how
# `omega` gates its own re-exports.
# winners of the 2026-09-04 sweep 3 arm B1 (43.052 ms/token, CoV 0.56%,
# 2.443x vs llama.cpp; op_count 938; text identical): `metal-output-placement`
# and `metal-wide-cooperative-reduce` fold into the default decode path here,
# `proxima-tensor/docs/discipline.md` ROW recorded. `kv-capacity-bucket`
# joined on the 2026-09-04 quiet round 1 sweep (bucket 32: wall 40.89 vs
# off 42.54 ms/token, hits 5/8; bucket 64: 41.18, hits 6/8; bucket 256:
# 48.18, loss) -- ROW 273 has the full table. `omega`'s paired-nibble Q5_K
# body (202,083 -> 124,265 ns/op, 1.63x, ROW 278) is selected by codec
# structure there, not a passthrough feature of this crate any longer.
# `metal-plan-stable-buffers` joins per CARD 6.5: plan-owned `BufferArena` +
# `PlanUniforms` take a plan-cache hit from 842 allocations/step to 0;
# op_setup 3.94-5.42 -> 0.39-0.60 ms/step, arena peak 13,967,368 B prefill
# (26.56x reuse over a naive 370,941,308 B), 450,568 B steady, text
# identical. `backend::Plan::Metal` is boxed under this feature, which is
# now the default `metal` shape.
# `cached-attention-streaming` joins per the owner's less-work rule (ROW 282):
# ROW 281's bake-off found no confirmed wall win (delta 0.07% of the OFF
# mean, inside both arms' CoV) but a real, measured reduction in work --
# `emit_calls` 938 -> 616 per decode step, GPU-side `total_gpu_ms` 35.266 ->
# 32.356 (-8.2%), `device_allocated_bytes` -131,072 B -- with
# `generated_text` identical across all 3 bake-off rounds. The owner's rule:
# keep a less-work change when output is identical and wall clock is not
# worse beyond noise, even if wall clock does not visibly move.
# The encoder dispatch type (ROW 285's bake-off, then ROW 312) is a runtime
# `Plan::set_dispatch_type`/`omega::DispatchType` value, not a feature -- see
# that type's own doc for the current default and rationale.
# `reduce-epilogue-fusion` joins per the owner's less-work rule: on the real
# openchat cached-decode oracle, `emit_calls` 616 -> 520, `barriers` 419 ->
# 323 (3 of 4 epilogued reduces per layer fuse into their reduce),
# `generated_text` identical ("Here is a simple Python function that
# returns"), `plan_hits` unchanged at 5. Same rule as `cached-attention-streaming`
# above: real reduction in work, output identical, ships default-on.
# `metal-packed-row-nsg2` joins per ROW 311: halves the packed-row matvec
# threadgroup count (`omega/Cargo.toml`'s own comment carries the mechanism),
# output identical, ships default-on per the less-work rule.
# `metal-q4k-ggml-port` joins per ROW 315 (`omega/Cargo.toml`'s own comment
# carries the mechanism and the interleaved-bake-off numbers) -- the fixed
# body is less work with identical output, default-on per the same rule.
metal = [
    "dep:omega",
    "std",
    "metal-output-placement",
    "metal-wide-cooperative-reduce",
    "kv-capacity-bucket",
    "metal-plan-stable-buffers",
    "reduce-epilogue-fusion",
    "metal-packed-row-nsg2",
    "metal-q4k-ggml-port",
]
# Cross-platform GPU serving through omega's wgpu driver.  The existing
# serving/runtime code is intentionally shared with the Metal path; on Linux
# omega resolves `Engine::Gpu` to wgpu, whose Vulkan backend is selected by
# wgpu at adapter discovery time.  Keeping this as an explicit feature makes
# the hardware boundary visible instead of silently turning a CPU build into
# a GPU build.
vulkan = ["metal", "omega?/wgpu-backend"]
# CUDA serving uses the same backend-agnostic model path as Vulkan, but
# selects omega's cudarc/NVRTC driver when no wgpu driver is requested.
cuda = ["metal", "omega?/cuda-driver"]
# cached-attention physical step for the real serving/decode harness; folded
# into `metal`'s default shape per ROW 282 but kept individually selectable
# so a caller can build without `metal` and still exercise the fused path on
# CPU (`proxima-tensor/cached-attention-streaming` alone).
cached-attention-streaming = [
    "dep:omega",
    "proxima-tensor/cached-attention-streaming",
    "omega?/cached-attention-streaming",
]
# Passthrough to `proxima-tensor/reduce-epilogue-fusion` and
# `omega/reduce-epilogue-fusion` -- folded into `metal`'s default shape above
# but kept individually selectable so this crate's own harness can exercise
# the fused-epilogue reduce on CPU (`proxima-tensor` alone) without
# requiring `metal`.
reduce-epilogue-fusion = [
    "proxima-tensor/reduce-epilogue-fusion",
    "omega?/reduce-epilogue-fusion",
]
# passthrough to `omega/metal-tiled-gemm` (default-off there, ROW `eeadc2d`)
# so this crate's own op-timed profiling tests can compare the row-blocked
# and tiled-GEMM paths' operand-byte traffic without a second harness.
metal-tiled-gemm = ["omega?/metal-tiled-gemm"]
# passthrough to `omega/metal-output-placement` (default-off there): turns
# on `generate.rs`'s persistent device-resident KV decode path (per-layer
# `PlacedBuffer`s allocated once at this call's own reachable position
# count, `mistral_single_range_cached_forward_program` in place of the
# two-range online-softmax program) in place of the always-on
# `LayerCache`-growing path. `metal` must also be enabled -- this feature
# has no effect without it, since `PlacedBuffer` is Metal-only.
metal-output-placement = ["omega?/metal-output-placement"]
# passthrough to `omega/metal-buffer-pool` so the decode harness can measure that arm.
metal-buffer-pool = ["omega?/metal-buffer-pool"]
# passthrough to `omega/metal-plan-stable-buffers` so the decode harness can measure that arm.
metal-plan-stable-buffers = ["omega?/metal-plan-stable-buffers"]
# passthrough to `omega/metal-wide-cooperative-reduce` so the decode harness can measure that arm.
metal-wide-cooperative-reduce = ["omega?/metal-wide-cooperative-reduce"]
# passthrough to `omega/metal-q4k-mask-fma` so the decode harness can measure that arm.
metal-q4k-mask-fma = ["omega?/metal-q4k-mask-fma"]
# passthrough to `omega/metal-q4k-split-k` so the decode harness can measure that arm.
metal-q4k-split-k = ["omega?/metal-q4k-split-k"]
# passthrough to `omega/metal-q4k-single-fetch` so the decode harness can measure that arm.
metal-q4k-single-fetch = ["omega?/metal-q4k-single-fetch"]
# passthrough to `omega/metal-packed-row-nsg2` so the decode harness can measure that arm.
metal-packed-row-nsg2 = ["omega?/metal-packed-row-nsg2"]
# Selects `proxima-tensor`'s `cpu_mask_zero_ulp` test, the correctness
# proof that rounding the placed-KV decode loop's growing KV extent
# (`merged_len`) up to `ServingConfig::kv_bucket_tokens` before binding it
# as the Metal plan's `Extent::Symbolic(1)`/plan-cache key is 0-ULP-safe
# for any bucket size (`spec.rs:11371`, CARD 6.1-6.3). The bucketing
# itself is unconditional runtime behaviour gated by
# `ServingConfig::kv_bucket_tokens` (see that field's own doc), not by
# this feature -- a bucket of 1 reduces to no bucketing. This feature only
# pulls in the CPU-side proof plus `omega`'s passthrough.
kv-capacity-bucket = [
    "proxima-tensor/kv-capacity-bucket",
    "omega?/kv-capacity-bucket",
]
# passthrough to `omega/metal-q4k-ggml-port` so the decode harness can measure that arm.
metal-q4k-ggml-port = ["omega?/metal-q4k-ggml-port"]
memmap2 = ["dep:memmap2"]

[dependencies]
arrayvec.workspace = true
# only used by `generate.rs`, which is `#[cfg(feature = "std")]`-gated —
# optional so the alloc-only floor never links it.
fastrand = { workspace = true, optional = true }
memmap2 = { version = "0.9.11", optional = true }
omega = { version = "0.1.0", path = "../omega", default-features = false, features = ["metal", "cpu"], optional = true }
prime = { version = "0.1.0", path = "../prime", features = ["runtime-prime-bgpool"], optional = true }
proxima-core = { workspace = true, features = ["alloc"], optional = true }
proxima-gguf = { path = "../proxima-gguf", default-features = false }
proxima-primitives = { workspace = true, default-features = false }
proxima-safetensors = { path = "../proxima-safetensors", default-features = false, features = ["alloc"] }
proxima-telemetry = { workspace = true, optional = true }
proxima-tensor = { path = "../proxima-tensor", default-features = false, features = ["alloc"] }
# `gguf` implies its own `std`, which is exactly the tier `generate::LoadedModel`
# already requires (it evaluates through `proxima_tensor::cpu`, itself std-gated)
# -- optional, wired on only by this crate's own `std` feature above, so the
# alloc-only floor never pulls it in.
proxima-tokenizer = { path = "../proxima-tokenizer", default-features = false, features = ["gguf"], optional = true }
serde = { workspace = true, features = ["derive", "alloc"] }
# `hf_config::HfConfig` deserializes a real HF config.json (alloc-tier, no
# std needed -- `cargo add` rejects this crate's own "alloc" feature entry
# on a validation quirk unrelated to the actual build; the workspace root
# already pins the version/features this line inherits, same as
# `proxima-safetensors`'s identical `serde_json.workspace = true`.
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
libc.workspace = true
half = { version = "2.7.1", default-features = false }
proxima-tensor = { path = "../proxima-tensor", features = ["config", "std", "test-support"] }
rustix.workspace = true
# `#[proxima::test]`/`#[case::desc(..)]` for the capability matrix in
# `tests/capability_matrix.rs` -- the adaptive default driver (`::proxima::
# test_support::run`) needs only `test-support`, no tokio/prime: every case
# body is synchronous CPU work through `LoadedModel`'s own `Pipe`, matching
# `generate.rs`'s own doc for why that pipe never yields.
proxima = { workspace = true, features = ["test-support"] }
proxima-tokenizer = { path = "../proxima-tokenizer", default-features = false, features = ["hf"] }
tempfile.workspace = true

# Both examples below need `LoadedModel` (`std`-gated in `lib.rs`) and
# `proxima_telemetry`'s recorder/macros (only pulled in by `instrument`,
# `dep:proxima-telemetry` above) -- `required-features` keeps a default
# (no-feature) `cargo build/nextest --workspace` from trying to build them
# at all, matching `proxima-tensor/Cargo.toml`'s own `q4k_ggml_fidelity`
# entry for the identical reason.
## No `required-features`: the GGML-matrix section builds and runs at the
## crate's default feature set; only the quantized-packed-format section
## (gated `#[cfg(feature = "metal")]` inside the example itself) needs
## `--features metal`, matching `src/capability.rs::quant_format`'s own gate.
[[example]]
name = "generate_compatibility_doc"

[[example]]
name = "smollm2_logit_oracle_diff"
required-features = ["std", "instrument"]

[[example]]
name = "smollm2_layer_oracle_diff"
required-features = ["std", "instrument"]

# Both examples below reuse the two shapes above, adapted to the real,
# hybrid `lfm2moe` checkpoint (GGUF bind + `lfm2_forward_values` in place of
# `LoadedModel`'s dense safetensors path). Same `required-features` reason.
[[example]]
name = "lfm2_logit_oracle_diff"
required-features = ["std", "instrument"]

[[example]]
name = "lfm2_layer_oracle_diff"
required-features = ["std", "instrument"]

# Layer-5-only routing diff: which four expert indices `append_moe_ffn`'s own
# `route` nodes picked per token, ours vs `llama.cpp`'s `ffn_moe_topk-<il>`
# dump -- no telemetry recorder, so no `instrument` requirement, only `std`
# for the same GGUF-bind/tokenizer/`cpu` interpreter reason as the two above.
[[example]]
name = "lfm2_moe_route_diff"
required-features = ["std"]

# Layer-0/1-only bisection (the dense-FFN layers before any MoE gate exists):
# normed / mixer_out / post_mixer / normed2 within one conv-mixer block, ours
# vs `llama.cpp`'s own per-tensor dumps -- no telemetry recorder needed, same
# `std`-only reason as `lfm2_moe_route_diff`.
[[example]]
name = "lfm2_dense_mixer_diff"
required-features = ["std"]

# Scratch sizing tool for the real Mixtral checkpoint: prints the derived
# architecture and whether the native stacked `_exps` tensor is present, so
# the owned-vs-packed MoE memory shape is known before attempting a forward
# pass. Same `std`-only reason as `lfm2_moe_route_diff`.
[[example]]
name = "mixtral_architecture_dump"
required-features = ["std"]

# Runs a synthesized Qwen3.5 checkpoint through `generate::LoadedModel`
# (`std`-gated) -- same reason as the examples above: a bare default-features
# build has no `LoadedModel` in the crate root, so this needs the same gate.
[[example]]
name = "synth_qwen35_decode"
required-features = ["std"]

[[example]]
name = "bench_local"
required-features = ["std"]

[[example]]
name = "compare_local"
required-features = ["std"]
