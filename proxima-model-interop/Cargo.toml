[package]
name = "proxima-model-interop"
description = "Sans-IO GGUF <-> safetensors transform over the format's common denominator (named tensors, dtype, shape, bytes); explicit about what each direction loses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
# strictly additive over the alloc-tier floor (guiding-principle 3): opens
# proxima-gguf's `edge::read_file` (whole-file IO) and proxima-tensor's
# `cpu` interpreter (both std-gated in their own crates) so this crate's
# gguf-tensor-by-name bind can be driven end to end through evaluation.
# The bind function itself (`bind::gguf_tensor_as_f32`) needs neither and
# stays available at the no_std+alloc floor either way.
# `proxima-tensor/config` is not optional here: `generate.rs` is a LIB module
# (`#[cfg(feature = "std")] mod generate`) and imports `proxima_tensor::spec`,
# which is `config`-gated. Until this line, `config` only ever arrived through
# [dev-dependencies], so `cargo build -p proxima-model-interop --features std`
# failed while `cargo test` passed — the dev-dep unified the feature in and hid
# it. A lib that only builds when its own tests are built is a broken lib.
std = [
    "proxima-gguf/std",
    "proxima-tensor/std",
    "proxima-tensor/config",
    "interop-bgpool",
    "dep:proxima-tokenizer",
]
# split from `std` the same way proxima-tensor splits `tensor-bgpool`
# (proxima-tensor/Cargo.toml:45): `dep:prime` pulls in OS threads, so it
# stays out of the alloc-only floor even though every current `std` build
# wants it (loader::prefault is the only std-gated consumer today).
interop-bgpool = ["dep:prime", "dep:proxima-core"]
# passthrough to `proxima-tensor/instrument` -- opt-in so the acceptance
# forward-pass test (`bind::real_openchat_file`) can also be built and run
# WITHOUT the per-chunk/per-node tick counters compiled in at all, to answer
# whether the instrumentation itself is part of what gets measured.
# `omega?/instrument` (the `?` skips the passthrough when `omega` itself is
# not a dependency, i.e. the `metal` feature is off) turns on the split-4019
# per-token attribution counters in `omega::metal` alongside this crate's own
# generate.rs-side ones, so a single feature flag lights up both halves of
# the decode-loop split rather than needing two.
instrument = ["proxima-tensor/instrument", "omega?/instrument"]
# Metal decode path (macOS + Metal only). `generate.rs`'s decode loop runs
# the cached forward through `omega::backend::plan_named`/`execute_plan_named`
# instead of `proxima_tensor::cpu::evaluate_quantized_named_with_scratch`
# directly, backend selected at runtime via `ServingConfig::gpu_layers`
# (`serving.rs`). `cpu` is turned on alongside `metal` so `omega::backend`'s
# `Backend::Cpu` arm is also compiled in this build -- the decode loop routes
# BOTH backends through the same `omega::backend` entry point rather than
# keeping a direct `proxima_tensor::cpu` call for one of them. `omega`'s own
# `metal` feature already confines every objc2/Metal dependency to a
# `target_os = "macos"` section, so this feature alone never links a Metal
# framework off Apple hardware; any future call site into `omega::metal`
# must additionally gate on `target_os = "macos"` directly, matching how
# `omega` gates its own re-exports.
metal = ["dep:omega", "std"]
# passthrough to `omega/metal-tiled-gemm` (default-off there, ROW `eeadc2d`)
# so this crate's own op-timed profiling tests can compare the row-blocked
# and tiled-GEMM paths' operand-byte traffic without a second harness.
metal-tiled-gemm = ["omega?/metal-tiled-gemm"]

[dependencies]
arrayvec.workspace = true
omega = { version = "0.1.0", path = "../omega", default-features = false, features = ["metal", "cpu"], optional = true }
prime = { version = "0.1.0", path = "../prime", features = ["runtime-prime-bgpool"], optional = true }
proxima-core = { workspace = true, features = ["alloc"], optional = true }
proxima-gguf = { path = "../proxima-gguf", default-features = false }
proxima-primitives = { workspace = true, default-features = false }
proxima-safetensors = { path = "../proxima-safetensors", default-features = false, features = ["alloc"] }
proxima-tensor = { path = "../proxima-tensor", default-features = false, features = ["alloc"] }
# `gguf` implies its own `std`, which is exactly the tier `generate::LoadedModel`
# already requires (it evaluates through `proxima_tensor::cpu`, itself std-gated)
# -- optional, wired on only by this crate's own `std` feature above, so the
# alloc-only floor never pulls it in.
proxima-tokenizer = { path = "../proxima-tokenizer", default-features = false, features = ["gguf"], optional = true }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
half = { version = "2.7.1", default-features = false }
proxima-tensor = { path = "../proxima-tensor", features = ["config", "std"] }
rustix.workspace = true
