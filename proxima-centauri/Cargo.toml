[package]
name = "proxima-centauri"
description = "Sans-IO, no-alloc cryptographic FSM substrate: entropy source polymorphism and BLAKE3 primitives over the proxima-primitives Pipe algebra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std", "aead-chacha20poly1305"]
# Nothing in the library surface is std-gated: it is no_std + no-alloc by
# construction, and `CentauriError` implements `core::error::Error`, which std
# re-exports as `std::error::Error`. The feature exists so a caller composing
# with std crates does not have to write `default-features = false`, and it
# admits the thread-based contention tests, which need an operating system.
std = []
# Swaps the entropy cell's atomics for loom's so its model checker can explore
# every interleaving exhaustively, rather than sampling them the way the
# thread test does. Default-off and test-only. A feature rather than
# `--cfg loom` because RUSTFLAGS would apply the cfg to every crate in the
# graph and break dependencies that carry their own loom support.
loom = ["dep:loom"]
# Config + fluent-builder surface for the handshake's per-session parameters
# (gate point 12). conflaguration is std-only, so this sits at the std
# composition boundary; the no-alloc core never sees it and takes plain values
# in its constructors. The PSK is deliberately NOT a config field -- see
# src/config.rs.
config = ["std", "dep:bon", "dep:conflaguration", "dep:serde"]

# AEAD suites. ADDITIVE, not exclusive: enabling both compiles both and the
# choice becomes a runtime value, mirroring the runtime-selection shape
# proxima uses for executors. A cipher suite is a wire-format agreement, so
# the peers must match -- but which one a binary *can* speak is a build
# decision and which one it *does* speak is a deployment one, and those are
# different questions.
#
# ChaCha20-Poly1305 is the default: constant-time in software everywhere,
# which matters on targets without AES instructions. AES-256-GCM wins where
# AES-NI or ARM crypto extensions exist -- see the compare-bench.
#
# `dep:aead` rides along with each suite rather than standing on its own: the
# nonce and tag shapes both suites agree on are the only thing it supplies
# here, so a handshake-only build compiles no AEAD crate at all.
aead-chacha20poly1305 = ["dep:aead", "dep:chacha20poly1305"]
aead-aes-gcm = ["dep:aead", "dep:aes-gcm"]

[dependencies]
loom = { version = "0.7", optional = true }
blake3 = { version = "1.8.5", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
proxima-clock.workspace = true
proxima-primitives.workspace = true
x25519-dalek = { version = "2.0.1", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
bon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
conflaguration = { workspace = true, features = ["derive", "toml"], optional = true }
subtle = { version = "2.6.1", default-features = false }
aead = { version = "0.5", default-features = false, optional = true }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
iai-callgrind = "0.16.1"
proptest.workspace = true
rstest.workspace = true
temp-env.workspace = true
tempfile.workspace = true
toml.workspace = true

[[bench]]
name = "bench_handshake"
harness = false

[[bench]]
name = "bench_esp"
harness = false
required-features = ["aead-chacha20poly1305"]

[build-dependencies]
toml.workspace = true

[[bench]]
name = "bench_cycles"
harness = false
required-features = ["aead-chacha20poly1305"]

[[bench]]
name = "bench_e2e_tunnel"
harness = false
required-features = ["aead-chacha20poly1305"]

[[example]]
name = "handshake_walkthrough"
required-features = ["aead-chacha20poly1305"]
