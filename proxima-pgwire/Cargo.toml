[package]
name = "proxima-pgwire"
description = "PostgreSQL wire protocol facade over the sans-IO proxima-protocols::pgwire_codec session FSM: a server side (TCP/TLS lifecycle, trust/cleartext/MD5/SCRAM auth, statement and portal store, LISTEN/NOTIFY, COPY) where the SQL engine is a QueryRequest -> PgReply pipe, and a client side (sans-IO ClientSession plus blocking and pipe drivers)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
proxima-protocols = { workspace = true, features = ["pgwire_codec", "std"] }
# `PgReply::QueryStream`'s row source: `async_channel::Receiver` is the one
# mpsc `Receiver` that is `Send + Sync + Clone` AND executor-agnostic, so a
# lazy row stream rides the reply without pulling tokio into the bare graph.
async-channel = { workspace = true }
# the SQL-over-Pipe contract is the core surface: the driver builds a
# `QueryRequest` and calls a `Pipe` per operation. `alloc` (no std) keeps
# tokio out of the no-default-features graph — the raw-socket-hijack seam
# (`pipe::upgrade`, std-only) is pulled in only by the `listen` feature below.
proxima-primitives = { workspace = true, default-features = false, features = ["alloc"] }
proxima-core = { workspace = true, default-features = false }
proxima-auth = { workspace = true, optional = true, features = ["alloc"] }
bon = { workspace = true }
bytes = { workspace = true }
conflaguration = { workspace = true, features = ["derive", "toml"] }
dashmap = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

proxima-listen = { workspace = true, optional = true }
proxima-runtime = { workspace = true, optional = true, features = ["std"] }
proxima-tls = { workspace = true, optional = true, features = ["futures-io"] }
futures-rustls = { workspace = true, optional = true, features = ["aws_lc_rs", "tls12"] }
serde_json = { workspace = true, optional = true }
proxima-net = { workspace = true, optional = true, default-features = false, features = ["tokio"] }
tokio = { workspace = true, optional = true, features = ["rt"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
md-5 = { version = "0.10", default-features = false, optional = true }
stringprep = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
# every credential comparison in the crate (username, password, MD5 digest,
# SCRAM proof, cancel key) goes through `ConstantTimeEq`; core (not
# feature-gated) because a hand-rolled loop the optimizer may short-circuit
# is exactly the defect this crate cannot afford on an auth path.
subtle = { version = "2.6.1", default-features = false }
# plaintext password + derived SCRAM key material zeroized on drop; core
# (not feature-gated) so the hygiene holds for Cleartext/MD5/SCRAM alike.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
# the house telemetry surface, never `tracing` directly; only the
# `tokio-compat` accept loop logs, so the dep rides that feature.
proxima-telemetry = { workspace = true, features = ["emit"], optional = true }

[features]
# the prime/native default: core driver + the connection-pipe upgrade seam
# + listener mount over the runtime-matched acceptor factory + TLS upgrades.
# `--no-default-features` leaves the sans-IO-adjacent core (driver over a
# query `Pipe`, handler helpers, auth, store, config) with zero tokio in the
# dependency graph for bare-metal embedding.
default = ["listen", "tls", "scram", "md5-auth"]
# `proxima-primitives/std` brings the `pipe::upgrade` raw-socket-hijack seam
# (std-only) the connection pipe's `UpgradeHandler` comes from, and lifts
# proxima-primitives::stream's traits from "absent" to present; the listener
# deps mount it.
listen = [
    "proxima-primitives/std",
    "proxima-core/std",
    "proxima-core/io-async-compat",
    "dep:proxima-listen",
    "dep:proxima-runtime",
    "dep:serde_json",
]
tls = ["dep:proxima-tls", "dep:futures-rustls"]
# legacy tokio TcpListener accept path + ambient spawn_local fallback for
# apps built without a runtime-matched acceptor factory. Off by default:
# prime/proxima-primitives::stream is the first-class path, tokio is compat.
tokio-compat = [
    "listen",
    "dep:proxima-net",
    "proxima-net/tokio",
    "dep:tokio",
    "dep:proxima-telemetry",
]
# SCRAM-SHA-256 (RFC 7677 / RFC 5802) — PostgreSQL's standard auth. Pulls
# the RustCrypto PBKDF2 / HMAC / SHA-256 primitives + SASLprep + base64.
scram = ["dep:pbkdf2", "dep:hmac", "dep:sha2", "dep:stringprep", "dep:base64", "dep:proxima-auth"]
# MD5 password auth (deprecated upstream, removed in PostgreSQL 18) — kept
# for legacy clients.
md5-auth = ["dep:md-5"]
# the async client `Pipe`: drives the sans-IO ClientSession over a
# `StreamUpstream` transport so `proxima::Client` speaks pgwire as a
# registered protocol (`proxima::PgwirePipeFactory` wraps it). Pulls
# proxima-primitives::stream (the transport seam); the blocking `PgClient`
# (under `scram`) needs none of this.
client = ["scram", "proxima-primitives/std"]

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
proxima-runtime = { workspace = true, features = ["tokio"] }
proxima-net = { workspace = true, features = ["tokio", "prime"] }
prime = { workspace = true }
proxima-tls = { workspace = true, features = ["futures-io"] }
futures-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
rustls = { workspace = true, features = ["std", "aws_lc_rs", "tls12"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "process"] }
tokio-postgres = { workspace = true }
rstest = { workspace = true }
temp-env = { workspace = true }
proxima = { workspace = true, features = ["test-support-tokio"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["listen"]

[[bench]]
name = "bench_scram_kdf"
harness = false
required-features = ["scram"]

[[example]]
name = "capture_realpg"
required-features = ["scram"]
