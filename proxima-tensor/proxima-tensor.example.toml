# Runtime execution policy for proxima-tensor. Copy to `proxima-tensor.toml`
# (the path `policy::discover` looks for in the working directory), or point
# `PROXIMA_TENSOR_CONFIG` at it anywhere.
#
# Every key below is OPTIONAL and every one shown holds the compiled default
# from `src/sized.rs` -- an empty file and this file resolve to the same
# policy. A missing key keeps the compiled value; it is never reset.
#
# Precedence, lowest to highest: src/sized.rs -> this file ->
# `PROXIMA_TENSOR_<KEY>` environment keys. So a sweep needs no file at all:
#
#     PROXIMA_TENSOR_WORKERS=8 cargo run --release ...
#
# Below `std` (the `no_std + alloc` tier) there is no loader and no file:
# `sized.rs` is the whole configuration surface, by design.

# Iteration-space elements below which a nest runs sequentially even when
# workers > 1.
parallel_threshold = 4096

# Chunk-count multiplier over `workers` for BoundOp chunk dispatch.
oversubscribe = 1

# Chunk-count multiplier over `workers` for the quantized matmul row split.
row_oversubscribe = 4

# Floor on multiply-adds per row-split chunk. Raising it gives fewer, larger
# chunks to shapes carrying little total work.
min_macs_per_chunk = 500000

# Row alignment applied to every non-final chunk boundary. 1 is a no-op.
split_alignment = 1

# Bytes of L2 budgeted for a resident `b` column panel in the tiled GEMM pass.
column_panel_budget_bytes = 2621440

# Threads for every threaded dispatch. 0 means detect (Apple P-cores via
# sysctl, else available_parallelism) -- the same spelling as llama.cpp's
# `-t 0`. This key replaces the removed `PROXIMA_MATMUL_WORKERS`.
workers = 0

# Spin-loop polls a cohort member burns before parking. 2000 is measured;
# 200 measured worse.
cohort_spin_polls = 2000

# Executor. "cpu" is the only one implemented -- "metal" resolves to a
# `todo!` that names the missing piece (omega::metal::execute cannot take
# packed quantized blocks).
device = "cpu"
