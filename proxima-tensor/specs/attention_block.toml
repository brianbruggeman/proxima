# A single-head attention block with RMSNorm and a full softmax, written as
# data. This file is the test of differentiator #1: if a real architecture
# cannot be expressed here, "a new architecture is a config file" is a claim
# with nothing behind it.
#
# Deliberately absent:
#   - RoPE, whose pairwise `2*i` / `2*i+1` addressing the grammar can now
#     spell (see `specs/rope.toml` and its `spec.rs` test) — left out of
#     *this* file only to keep the block one architecture at a time.
#   - causal masking, which needs a tensor derived from iteration indices;
#     there is no `Op` that produces one, and no notation change fixes that.
# `inv_dim` stands in for the still-absent piece here; there is no mask at
# all, which is exactly how far the config face reaches for masking today.

# --- inputs -----------------------------------------------------------------

[[node]]
op = "input"
id = "x"
dtype = "float32"
shape = ["?0", 8]

[[node]]
op = "input"
id = "inv_dim"
dtype = "float32"
shape = ["?0"]

[[node]]
op = "input"
id = "wq"
dtype = "float32"
shape = [8, 8]

[[node]]
op = "input"
id = "wk"
dtype = "float32"
shape = [8, 8]

[[node]]
op = "input"
id = "wv"
dtype = "float32"
shape = [8, 8]

# --- rmsnorm ----------------------------------------------------------------

[[node]]
op = "elementwise"
id = "x_squared"
dtype = "float32"
body = "multiply"
inputs = ["x", "x"]
maps = ["sd->sd", "sd->sd"]

[[node]]
op = "reduce"
id = "sum_squares"
dtype = "float32"
body = "add"
init = "zero"
input = "x_squared"
in_map = "sd->sd"
out_map = "s->sd"
keep = "reduce"

[[node]]
op = "elementwise"
id = "mean_square"
dtype = "float32"
body = "multiply"
inputs = ["sum_squares", "inv_dim"]
maps = ["s->s", "s->s"]

[[node]]
op = "elementwise"
id = "rms"
dtype = "float32"
body = "square_root"
inputs = ["mean_square"]
maps = ["s->s"]

[[node]]
op = "elementwise"
id = "inv_rms"
dtype = "float32"
body = "reciprocal"
inputs = ["rms"]
maps = ["s->s"]

[[node]]
op = "elementwise"
id = "normed"
dtype = "float32"
body = "multiply"
inputs = ["x", "inv_rms"]
maps = ["sd->sd", "s->sd"]

# --- q / k / v projections --------------------------------------------------

[[node]]
op = "elementwise"
id = "q_product"
dtype = "float32"
body = "multiply"
inputs = ["normed", "wq"]
maps = ["sd->shd", "dh->shd"]

[[node]]
op = "reduce"
id = "q"
dtype = "float32"
body = "add"
init = "zero"
input = "q_product"
in_map = "shd->shd"
out_map = "sh->shd"
keep = "reduce"

[[node]]
op = "elementwise"
id = "k_product"
dtype = "float32"
body = "multiply"
inputs = ["normed", "wk"]
maps = ["sd->shd", "dh->shd"]

[[node]]
op = "reduce"
id = "k"
dtype = "float32"
body = "add"
init = "zero"
input = "k_product"
in_map = "shd->shd"
out_map = "sh->shd"
keep = "reduce"

[[node]]
op = "elementwise"
id = "v_product"
dtype = "float32"
body = "multiply"
inputs = ["normed", "wv"]
maps = ["sd->shd", "dh->shd"]

[[node]]
op = "reduce"
id = "v"
dtype = "float32"
body = "add"
init = "zero"
input = "v_product"
in_map = "shd->shd"
out_map = "sh->shd"
keep = "reduce"

# --- scores -----------------------------------------------------------------

[[node]]
op = "elementwise"
id = "score_product"
dtype = "float32"
body = "multiply"
inputs = ["q", "k"]
maps = ["sh->sth", "th->sth"]

[[node]]
op = "reduce"
id = "scores"
dtype = "float32"
body = "add"
init = "zero"
input = "score_product"
in_map = "sth->sth"
out_map = "st->sth"
keep = "reduce"

# --- softmax over the key axis ----------------------------------------------

[[node]]
op = "reduce"
id = "score_max"
dtype = "float32"
body = "maximum"
init = "negative_infinity"
input = "scores"
in_map = "st->st"
out_map = "s->st"
keep = "reduce"

[[node]]
op = "elementwise"
id = "shifted"
dtype = "float32"
body = "subtract"
inputs = ["scores", "score_max"]
maps = ["st->st", "s->st"]

[[node]]
op = "elementwise"
id = "weights"
dtype = "float32"
body = "exponential"
inputs = ["shifted"]
maps = ["st->st"]

[[node]]
op = "reduce"
id = "weight_sum"
dtype = "float32"
body = "add"
init = "zero"
input = "weights"
in_map = "st->st"
out_map = "s->st"
keep = "reduce"

[[node]]
op = "elementwise"
id = "inv_weight_sum"
dtype = "float32"
body = "reciprocal"
inputs = ["weight_sum"]
maps = ["s->s"]

[[node]]
op = "elementwise"
id = "probabilities"
dtype = "float32"
body = "multiply"
inputs = ["weights", "inv_weight_sum"]
maps = ["st->st", "s->st"]

# --- weighted sum of values -------------------------------------------------

[[node]]
op = "elementwise"
id = "attended_product"
dtype = "float32"
body = "multiply"
inputs = ["probabilities", "v"]
maps = ["st->sth", "th->sth"]

[[node]]
op = "reduce"
id = "attended"
dtype = "float32"
body = "add"
init = "zero"
input = "attended_product"
in_map = "sth->sth"
out_map = "sh->sth"
keep = "reduce"
name = "attention_block"
