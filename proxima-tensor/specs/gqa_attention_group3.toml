# `gqa_attention.toml` at a non-power-of-two group size: 6 query heads, 2 kv
# heads, group 3 — the shape deepseek-coder-33b actually uses
# (`head_count=56`, `head_count_kv=8`, group 7), scaled down to a
# hand-checkable size rather than reproduced at 56/8. The only changes from
# `gqa_attention.toml` are `wq`'s head extent (4 -> 6), `group_ones`'s shape
# (`[2, 2]` -> `[2, 3]`), and the literal coefficient in `q_grouped`'s affine
# term (`2*u+g` -> `3*u+g`); nothing in `map.rs`'s `AxisTerm { axis, coeff }`
# treats `coeff` specially by value, so this file is the check that claim
# actually holds rather than an assumption resting on `coeff=2` alone.

# --- inputs -------------------------------------------------------------

[[node]]
op = "input"
id = "x"
dtype = "float32"
shape = ["?0", 4]

[[node]]
op = "input"
id = "wq"
dtype = "float32"
shape = [4, 6, 4]

[[node]]
op = "input"
id = "wk"
dtype = "float32"
shape = [4, 2, 4]

[[node]]
op = "input"
id = "wv"
dtype = "float32"
shape = [4, 2, 4]

[[node]]
op = "input"
id = "group_ones"
dtype = "float32"
shape = [2, 3]

# --- q / k / v projections, heads kept as their own axis -----------------

[[node]]
op = "elementwise"
id = "q_product"
dtype = "float32"
body = "multiply"
inputs = ["x", "wq"]
maps = ["si->shdi", "ihd->shdi"]

[[node]]
op = "reduce"
id = "q"
dtype = "float32"
body = "add"
init = "zero"
input = "q_product"
in_map = "shdi->shdi"
out_map = "shd->shdi"
keep = "reduce"

# `q`'s flat head axis decomposed into (kv-head, group-offset), pinned by
# `group_ones`'s own bare axes — see `gqa_attention.toml`'s header for why
# the pin cannot live inside `score_product` itself.
[[node]]
op = "elementwise"
id = "q_grouped"
dtype = "float32"
body = "multiply"
inputs = ["q", "group_ones"]
maps = ["s,3*u+g,d->sugd", "ug->sugd"]

[[node]]
op = "elementwise"
id = "k_product"
dtype = "float32"
body = "multiply"
inputs = ["x", "wk"]
maps = ["si->sudi", "iud->sudi"]

[[node]]
op = "reduce"
id = "k"
dtype = "float32"
body = "add"
init = "zero"
input = "k_product"
in_map = "sudi->sudi"
out_map = "sud->sudi"
keep = "reduce"

[[node]]
op = "elementwise"
id = "v_product"
dtype = "float32"
body = "multiply"
inputs = ["x", "wv"]
maps = ["si->sudi", "iud->sudi"]

[[node]]
op = "reduce"
id = "v"
dtype = "float32"
body = "add"
init = "zero"
input = "v_product"
in_map = "sudi->sudi"
out_map = "sud->sudi"
keep = "reduce"

# --- scores: q_grouped is already (s,u,g,d), k stays broadcast over g ----

[[node]]
op = "elementwise"
id = "score_product"
dtype = "float32"
body = "multiply"
inputs = ["q_grouped", "k"]
maps = ["sugd->stugd", "tud->stugd"]

[[node]]
op = "reduce"
id = "scores"
dtype = "float32"
body = "add"
init = "zero"
input = "score_product"
in_map = "stugd->stugd"
out_map = "stug->stugd"
keep = "reduce"

# --- causal mask ----------------------------------------------------------

[[node]]
op = "iota"
id = "query_index"
dtype = "float32"
extent = "?0"

[[node]]
op = "iota"
id = "key_index"
dtype = "float32"
extent = "?0"

[[node]]
op = "elementwise"
id = "is_future"
dtype = "float32"
body = "greater"
inputs = ["key_index", "query_index"]
maps = ["t->st", "s->st"]

[[node]]
op = "elementwise"
id = "zero"
dtype = "float32"
body = "subtract"
inputs = ["query_index", "query_index"]
maps = ["s->s", "s->s"]

[[node]]
op = "elementwise"
id = "neg_zero"
dtype = "float32"
body = "negate"
inputs = ["zero"]
maps = ["s->s"]

[[node]]
op = "elementwise"
id = "neg_infinity"
dtype = "float32"
body = "reciprocal"
inputs = ["neg_zero"]
maps = ["s->s"]

[[node]]
op = "elementwise"
id = "scores_masked"
dtype = "float32"
body = "select"
inputs = ["is_future", "neg_infinity", "scores"]
maps = ["st->stug", "s->stug", "stug->stug"]

# --- softmax over the key axis --------------------------------------------

[[node]]
op = "reduce"
id = "score_max"
dtype = "float32"
body = "maximum"
init = "negative_infinity"
input = "scores_masked"
in_map = "stug->stug"
out_map = "sug->stug"
keep = "reduce"

[[node]]
op = "elementwise"
id = "shifted"
dtype = "float32"
body = "subtract"
inputs = ["scores_masked", "score_max"]
maps = ["stug->stug", "sug->stug"]

[[node]]
op = "elementwise"
id = "weights"
dtype = "float32"
body = "exponential"
inputs = ["shifted"]
maps = ["stug->stug"]

[[node]]
op = "reduce"
id = "weight_sum"
dtype = "float32"
body = "add"
init = "zero"
input = "weights"
in_map = "stug->stug"
out_map = "sug->stug"
keep = "reduce"

[[node]]
op = "elementwise"
id = "inv_weight_sum"
dtype = "float32"
body = "reciprocal"
inputs = ["weight_sum"]
maps = ["sug->sug"]

[[node]]
op = "elementwise"
id = "probabilities"
dtype = "float32"
body = "multiply"
inputs = ["weights", "inv_weight_sum"]
maps = ["stug->stug", "sug->stug"]

# --- weighted sum of values, v stays broadcast over g like k -------------

[[node]]
op = "elementwise"
id = "attended_product"
dtype = "float32"
body = "multiply"
inputs = ["probabilities", "v"]
maps = ["stug->stugd", "tud->stugd"]

[[node]]
op = "reduce"
id = "attended"
dtype = "float32"
body = "add"
init = "zero"
input = "attended_product"
in_map = "stugd->stugd"
out_map = "sugd->stugd"
keep = "reduce"
name = "gqa_attention_block_group3"
