[package]
name = "proxima-safetensors"
description = "Sans-IO safetensors reader: header + tensor-directory FSM over chunked bytes, no dequantization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std"]
alloc = []
# runtime config surface ([`config::SafetensorsParserConfig`]): conflaguration
# is std-only (Settings/env/file), so it rides in only here -- the
# no_std+alloc floor never sees it and always uses `crate::sized` directly.
std = ["alloc", "thiserror/std", "dep:bon", "dep:conflaguration", "dep:serde"]

[dependencies]
bon = { workspace = true, optional = true }
bytes = { workspace = true }
conflaguration = { workspace = true, features = ["derive", "toml"], optional = true }
proxima-codec = { workspace = true, features = ["alloc"] }
proxima-primitives = { workspace = true, features = ["alloc"] }
proxima-tensor = { path = "../proxima-tensor", default-features = false, features = ["alloc"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
temp-env.workspace = true
proxima = { workspace = true, features = ["test-support"] }
# real-file parity test only (`tests/bf16_real_checkpoint_parity.rs`):
# the crate's own [dependencies] entry above stays alloc-tier (no
# dequantization is this crate's job), but exercising the actual matmul
# kernel a real bf16 tensor reaches needs proxima-tensor's std-gated
# cpu.rs -- dev-only, so a default build's dependency graph is unaffected.
proxima-tensor = { path = "../proxima-tensor", features = ["std", "config", "test-support"] }
half = { version = "2.7.1", default-features = false }

[lints]
workspace = true
