name: secrets

# gitleaks over the commits a push or pull request adds. the local secret-guard
# hook is the first line; this catches commits made with --no-verify and hosts
# without gitleaks. history was audited once (2026-11-11); routine runs scan
# only new commits, and a manual run re-audits full history, where reviewed
# false positives are listed in .gitleaksignore.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..HEAD"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            range="HEAD"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="origin/$DEFAULT_BRANCH..HEAD"
          fi
          count="$(git rev-list --count "$range")"
          echo "scanning $count commits in $range"
          gitleaks git --log-opts="$range" --redact --no-banner --verbose .
