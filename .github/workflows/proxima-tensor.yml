name: proxima-tensor

# Measured 2026-08-19: `proxima-tensor` appeared in zero workflows and zero
# gate scripts while carrying seven features and more `target_arch` branching
# than any other crate here. Two consequences, both real:
#
#   - `tensor-bgpool` was referenced exactly ONCE in the repository, by its own
#     Cargo.toml definition. A whole alternate execution backend that nothing
#     ever compiled.
#   - Nothing cross-compiled. `no-std.yml`'s matrix covers `prime` only, every
#     dev box here is arm64, and the portable (non-NEON) arm of cpu.rs was
#     dead-code-broken on `cargo check --target x86_64-*` while the host build
#     stayed green.
#
# Every cell is ENFORCED — no `continue-on-error`. A red cell that reports a
# green job is the failure mode no-std.yml already documents at its head.

on:
  push:
    branches: [main, "feat/tensor-*", "verify/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    uses: ./.github/workflows/affected.yml

  # The feature/target matrix. Runs each feature ALONE as well as unified, so a
  # feature that only compiles next to its siblings cannot hide, and asserts a
  # nonzero doctest count rather than trusting `cargo test --doc`'s exit code.
  proxima-tensor-gate:
    name: proxima-tensor-gate.sh
    needs: changes
    if: needs.changes.outputs.tensor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-tensor-gate.sh

  # proxima-tokenizer's own gate: `default = ["std"]` does not pull in
  # `gguf`, so the crate's own documented `cargo test -p proxima-tokenizer`
  # compiles none of gguf.rs's tests and reports GREEN having run zero of
  # them — including the llama.cpp oracle parity fixtures, `#[ignore]`d
  # because they read a real GGUF file from disk, which neither this job's
  # sibling `model-formats` cell (no `-- --ignored`) nor a bare
  # `--features gguf` run ever reaches. See scripts/proxima-tokenizer-gate.sh
  # for the full cell list and the nonzero-count assertion.
  proxima-tokenizer-gate:
    name: proxima-tokenizer-gate.sh
    needs: changes
    if: needs.changes.outputs.tensor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-tokenizer-gate.sh

  # The model-format crates. They are sans-IO parsers with a no_std + alloc
  # floor, so the floor is the thing worth proving — a parser that quietly
  # needs std is a parser that cannot run at the tier it advertises.
  model-formats:
    name: ${{ matrix.crate }} (${{ matrix.tier }})
    needs: changes
    if: needs.changes.outputs.tensor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [proxima-gguf, proxima-safetensors, proxima-onnx, proxima-model-interop, proxima-tokenizer]
        tier: [default, alloc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: clippy + tests + rustdoc
        run: |
          if [ "${{ matrix.tier }}" = "alloc" ]; then
            cargo clippy -p ${{ matrix.crate }} --no-default-features --features alloc -- -D warnings
          else
            cargo clippy -p ${{ matrix.crate }} --all-targets --all-features -- -D warnings
            cargo nextest run -p ${{ matrix.crate }} --all-features --no-fail-fast
            # rustdoc is its own gate, not a clippy side effect: three private
            # `dequantize_block` fns and a private `Phase::Done` broke their own
            # modules' intra-doc links in proxima-gguf and nothing here ran
            # `cargo doc` to see it. clippy and nextest are both green on a
            # crate whose docs do not build.
            cargo doc -p ${{ matrix.crate }} --no-deps --all-features
          fi

  # omega carries the Metal execution driver, gated by `objc2` deps that only
  # resolve in `[target.'cfg(target_os = "macos")'.dependencies]` — its
  # `default = ["std", "metal", "cpu"]` feature set is only fully reachable on
  # a macOS runner. Measured 2026-08-19 (see this workflow's own header):
  # omega appeared in ZERO workflows and ZERO gate scripts, so its own
  # `metal_vs_cpu` incumbent bench (Metal vs CPU on the same evaluator) sat
  # registered and unexecuted the same way `bench_vs_ggml` did in
  # proxima-tensor. GH's macos-latest runners are real Apple Silicon
  # hardware, so `metal` compiles and its bench links here — unlike
  # `ggml-bench` in proxima-tensor-gate.sh, this feature needs no external
  # asset (no vendored checkout, no multi-GB model file), so it belongs in
  # CI rather than a local-only runner.
  omega-gate:
    name: omega (macos-latest)
    needs: changes
    if: needs.changes.outputs.tensor == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: cargo clippy -p omega --all-targets -- -D warnings
      - run: cargo nextest run -p omega --no-fail-fast
      - run: cargo doc -p omega --no-deps

  # Compare-bench (Metal vs CPU, same evaluator). Smoke-runs the incumbent
  # bench so it can never again sit registered-but-unexecuted; `--quick`
  # keeps CI fast and, like proxima-telemetry's compare-bench job, this
  # records a baseline rather than sealing a discipline row (that's a manual
  # read of the CoV).
  omega-compare-bench:
    name: compare-bench (metal vs cpu)
    needs: changes
    if: needs.changes.outputs.tensor == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p omega --features metal --bench metal_vs_cpu -- --quick
