name: no-std

# First CI workflow in this repo. Convention going forward:
#   - Profile-driven builds set PROXIMA_PROFILE=<name> as an env var.
#   - Each crate's build.rs (via proxima_build::resolve_profile() under
#     `if env::var("PROXIMA_PROFILE").is_ok()`) reads the profile,
#     emits the cargo:rustc-cfg directives + generated module.
#   - No wrapper binary; the env var IS the API.
#   - The host-target linux-daemon profile is the floor that must
#     always pass.
#   - Every cell here is ENFORCED. The cross-compile cells were
#     continue-on-error while DC5 was open; that made a red cell read
#     as a green job, so nobody could tell which of them failed.

on:
  push:
    branches: [main, "nostd-cliff", "nostd-tier-lift", "verify/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    uses: ./.github/workflows/affected.yml

  # Floor: the linux-daemon profile must always build green. If this
  # breaks the whole cliff is dead.
  linux-daemon:
    name: PROXIMA_PROFILE=linux-daemon
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    env:
      PROXIMA_PROFILE: linux-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p prime
      # the default feature set compiles almost nothing (every submodule
      # except `sized` is behind a runtime-prime-* flag), so name the stack
      # that actually carries the scheduler or this step proves nothing.
      - run: cargo test -p prime --lib --features runtime-prime-executor,runtime-prime-inbox-alloc,runtime-prime-reactor,runtime-prime-bgpool

  # nostd-gate.sh hygiene check — production code under prime/src/core/*
  # must stay std-import-free except for the allow-listed TLS sites
  # documented in the gate's allow-list.
  nostd-gate:
    name: nostd-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/nostd-gate.sh

  # tokio-free-floor.sh — the CI gate that locks in
  # docs/pipe-to-metal/edges.md's "tokio/futures compat-layer sweep"
  # scoping-pass finding (2026-07-16): prime, proxima-primitives,
  # proxima-net, proxima-runtime, proxima-protocols, proxima-core all
  # carry zero transitive tokio at their no_std + alloc floor tier.
  # Re-proves the invariant on every commit (principle 16) instead of
  # relying on a scoping doc's memory. Same cargo-tree + grep shape
  # already proven in .github/workflows/proxima-{pgwire,redis}.yml's
  # tokio-gate jobs, matrixed over the floor crate set instead of one
  # crate.
  tokio-free-floor:
    name: tokio-free-floor.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/tokio-free-floor.sh

  # thumbv7m-cliff-gate.sh — every crate that claims a no_std + alloc
  # floor tier must actually build on a real embedded target, not just
  # under `--features alloc` on the host. Mirrors quic-h3-gate.sh's
  # thumbv7m cells, matrixed over the whole floor crate set.
  thumbv7m-cliff-gate:
    name: thumbv7m-cliff-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/thumbv7m-cliff-gate.sh

  # quic-h3-gate.sh — sans-IO proto crates must build at tier-1 (no_std +
  # alloc) AND tier-3 (no_std + no_alloc) AND on the thumbv7m-none-eabi
  # cliff. Per `proxima/docs/proxima-quic/discipline.md` A0 row.
  # Tokio-free facade check is staged in but disabled until C41 cutover.
  quic-h3-gate:
    name: quic-h3-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/quic-h3-gate.sh

  # tier-lift-gate.sh — re-proves the nostd-tier-lift claims (principle 16):
  # proxima-primitives::sync::blocking / AsyncMutex (std / futex / async-mutex-on-thumbv7m,
  # folded from proxima-lock in Workstream F), the bare-metal lifts
  # (control-plane / shutdown / recording-core on thumbv7m), the transport
  # fan-out dedup, and the conflaguration bridge tests. Enforced — every one
  # of these is proven passing on the branch, so a regression is a real break.
  tier-lift-gate:
    name: tier-lift-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/tier-lift-gate.sh

  # proxima-runtime-gate.sh — the crate's own commands (`nextest run -p
  # proxima-runtime`, `clippy -p proxima-runtime --all-targets`) see only
  # `default = ["std"]`, so concurrency/, tokio/ and background_rayon.rs —
  # three quarters of the crate — were never gated at all. Runs the matrix:
  # default, --all-features, both no_std tiers, and each feature ALONE.
  proxima-runtime-gate:
    name: proxima-runtime-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-runtime-gate.sh

  # proxima-config-gate.sh — same shape, same reason: the crate's own commands
  # see only `default = ["std"]`, which is the config-format registry, while
  # `sugar`, `schema*` and `store*` (three former satellite crates folded in)
  # are default-off. 17 of 89 tests ran; seven of the eight feature cells did
  # not build their test target at all. Runs the matrix: default,
  # --all-features, both no_std tiers, rustdoc per tier, and each feature ALONE.
  proxima-config-gate:
    name: proxima-config-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-config-gate.sh

  # proxima-test-gate.sh — same shape, sharper edge: proxima-test is
  # `default = []` and BOTH drivers are default-off, so the bare cell compiles
  # none of the harness. On 2026-08-05 `cargo check -p proxima-test
  # --all-targets` had been exiting 101 on sixteen dead-code errors, invisible
  # to every workspace command because they all unify a driver in. Runs each
  # driver ALONE (they select different `run` bodies), the bare cell, the
  # union, the doctest count, and RUNS the macro's own e2e smoke.
  proxima-test-gate:
    name: proxima-test-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-test-gate.sh

  # proxima-storage-gate.sh — same shape again: the crate is `default = []`,
  # so `cargo nextest run -p proxima-storage` ran 21 tests, every one of them
  # `pmem::cow::tests`, while the nvme engine tests, the dax tests and the
  # whole of `nvme/uio.rs` were never compiled by a crate-scoped command.
  # Three folded-in former crates, two thirds of them invisible. Runs each
  # feature ALONE, the union, and actually RUNS the cow_walkthrough example.
  proxima-storage-gate:
    name: proxima-storage-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-storage-gate.sh

  # proxima-listen-gate.sh — same shape again: `default = ["std"]` leaves
  # `stream`/`tokio`/`tls`/`framed-any` off, and the `proxima` dev-dependency
  # silently unifies three of the four back on, so only `framed-any` shows the
  # hole. Measured 2026-08-05: the default command ran 124 tests,
  # `--all-features` ran 130, and the six `any::framed_any` tests plus that
  # module's doctest had never run under any crate-scoped command. Also the
  # only place rustdoc runs on this crate (eleven broken links at default
  # features on the pre-audit tree).
  proxima-listen-gate:
    name: proxima-listen-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-listen-gate.sh

  # proxima-auth-gate.sh — same shape, sharpest ratio yet: `default = ["std"]`
  # leaves `signing` / `digest` / `negotiate` off, and unlike proxima-listen
  # nothing in the dev graph unifies them back on, so a crate-scoped command
  # compiles one of four modules with no accident to soften it. Measured
  # 2026-08-05: `cargo nextest run -p proxima-auth` ran 8 tests,
  # `--all-features` ran 32 — every AWS SigV4 and RFC 7616 parity vector the
  # crate owns sat in the 24 that no gate ran. Also the only place rustdoc and
  # the doctest count run on this crate.
  proxima-auth-gate:
    name: proxima-auth-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-auth-gate.sh

  # proxima-recording-gate.sh — same shape, different failure mode. Here the
  # dev graph DOES unify two of the five non-default features back on (the
  # crate dev-depends on the `proxima` umbrella, which depends back with
  # `features = ["pipe", "replay"]`), which is exactly what made the hole hard
  # to see: `-p proxima-recording` looks like it covers the crate. It does not
  # cover `durable-wal`, `pipe-config` or `replay-config`, which grep confirms
  # nothing in the tree turns on. Measured 2026-08-05 pre-audit:
  # `--features replay-config` failed clippy -D warnings, `--features
  # durable-wal` ran 6 tests with 2 failing, and `cargo doc` failed on six
  # intra-doc links. Also the only place rustdoc and the doctest count run on
  # this crate.
  proxima-recording-gate:
    name: proxima-recording-gate.sh
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - run: bash scripts/proxima-recording-gate.sh

  # No_std cross-compile cells. Each cell sets PROXIMA_PROFILE so the
  # build.rs can pick up the profile and emit profile-driven cfg
  # directives. Enforced as of 2026-08-08: `continue-on-error: true`
  # reported a failing cell as a passing job, which is how the wasm32
  # cell stayed red — `--features std` pulled `socket2`, whose every
  # call site in prime is already macos/linux-gated but whose Cargo
  # edge was not, and socket2 is a hard `compile_error!` on wasm32.
  no-std-matrix:
    name: PROXIMA_PROFILE=${{ matrix.profile }} target=${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.nostd == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: wasm-edge
            target: wasm32-unknown-unknown
            features: "alloc,std"
            proves: "prime's std tier carries no socket/thread dependency edge a sandboxed target cannot link"
          - profile: embedded-mqtt-gateway
            target: thumbv7em-none-eabihf
            features: "alloc"
            proves: "the no_std + alloc floor links on hard-float Cortex-M4/M7"
          - profile: bare-metal
            target: thumbv7em-none-eabihf
            features: ""
            proves: "the bare no_std, no-alloc floor links with nothing turned on"
    env:
      PROXIMA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: what this cell proves
        run: |
          echo "${{ matrix.proves }}"
      - name: cargo build (features=${{ matrix.features }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build -p prime --target ${{ matrix.target }} --no-default-features
          else
            cargo build -p prime --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}
          fi
