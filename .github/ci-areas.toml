# CI areas for change-scoped gates (consumed by scripts/ci-affected.py).
# An area runs when a changed file is in one of its packages' Cargo
# dependency closure, OR matches one of its path globs. A change to a shared
# leaf crate fans out to every area that depends on it automatically.

[area.prime_serve]
packages = ["proxima"]
paths = ["scripts/prime-serve-gate.sh", ".github/workflows/prime-serve.yml"]

# tutorial snippets cite the public API of every crate `proxima` depends on
# (proxima-primitives::pipe, App/RunConfig, the protocol crates); an
# unrelated-looking rename anywhere in that closure is exactly the class of
# change this gate exists to catch, so it shares prime_serve's package scope.
[area.tutorials]
packages = ["proxima"]
paths = [
    "docs/tutorials/**",
    "scripts/tutorials-gate.sh",
    ".github/workflows/tutorials.yml",
    "src/tutorial_doctests.rs",
]

[area.pgwire]
packages = ["proxima-pgwire"]
paths = ["scripts/proxima-pgwire-gate.sh", ".github/workflows/proxima-pgwire.yml"]

[area.centauri]
packages = ["proxima-centauri"]
paths = ["scripts/centauri-gate.sh", ".github/workflows/centauri.yml", "proxima-centauri/proxima-centauri.toml"]

[area.redis]
packages = ["proxima-redis"]
paths = ["scripts/proxima-redis-gate.sh", ".github/workflows/proxima-redis.yml"]

# The five protocol crates (memcached/dns/kafka/mqtt/amqp) all depend on
# proxima-listen through their optional `listen` feature — an optional dep
# isn't in the default-feature resolve graph cargo-metadata walks, so the
# dependency-closure detection above can't see it. proxima-listen and
# proxima-protocols are path-globbed explicitly so a change to either shared
# driver still trips this area (a proxima-listen change breaking kafka must
# not stay green).
[area.protocol_fleet]
packages = ["proxima-memcached", "proxima-dns", "proxima-kafka", "proxima-mqtt", "proxima-amqp"]
paths = [
    "scripts/protocol-fleet-gate.sh",
    ".github/workflows/proxima-protocol-fleet.yml",
    "proxima-memcached/**",
    "proxima-dns/**",
    "proxima-kafka/**",
    "proxima-mqtt/**",
    "proxima-amqp/**",
    "proxima-listen/**",
    "proxima-protocols/**",
]

[area.telemetry]
packages = ["proxima-telemetry"]
paths = ["scripts/telemetry-gate.sh", ".github/workflows/proxima-telemetry.yml"]

[area.nostd]
packages = [
    "prime",
    "proxima-protocols",
    "proxima-primitives",
    "proxima-patterns",
    "proxima-recording",
    "proxima-listen",
    "proxima-net",
    "proxima-runtime",
    "proxima-core",
    "proxima-config",
    "proxima-test",
    "proxima-storage",
    # only reaches the nostd area today through proxima-patterns' optional
    # dependency on it; named directly because it now carries its own
    # thumbv7m cliff cells, which must not depend on a sibling for coverage.
    "proxima-auth",
    # `packages` are dependency-closure ROOTS, so a leaf that DEPENDS on a root
    # is not reached by it. Each crate below owns a cell in a script this area
    # runs, yet editing it left `nostd=false` and the whole workflow skipped —
    # a gate that cannot be triggered proves nothing. Verified with the
    # detector itself: `python3 scripts/ci-affected.py --changed
    # proxima-redis/src/lib.rs` printed `nostd=false` before this block.
    # thumbv7m-cliff-gate.sh + tokio-free-floor.sh bare-tier cells:
    "proxima-redis",
    "proxima-dns",
    "proxima-amqp",
    "proxima-kafka",
    "proxima-mqtt",
    "proxima-memcached",
    # quic-h3-gate.sh (quinn-free facade, http3 cells) + tier-lift-gate.sh:
    "proxima-http",
    "proxima-quic",
    # proxima-test-gate.sh runs the macro smoke through the umbrella itself.
    "proxima",
    # _floor-crate-matrix.sh's model-stack cells (added 2026-08-19). Same reason
    # as the block above: editing proxima-gguf left `nostd=false`, so the cliff
    # cell proving its no_std+alloc floor would never have run.
    "proxima-tensor",
    "proxima-gguf",
    "proxima-safetensors",
    "proxima-onnx",
    "proxima-tokenizer",
]
paths = [
    "scripts/nostd-gate.sh",
    "scripts/nostd-gate.awk",
    "scripts/quic-h3-gate.sh",
    "scripts/tier-lift-gate.sh",
    "scripts/tokio-free-floor.sh",
    "scripts/thumbv7m-cliff-gate.sh",
    "scripts/proxima-runtime-gate.sh",
    "scripts/proxima-config-gate.sh",
    "scripts/proxima-test-gate.sh",
    "scripts/proxima-storage-gate.sh",
    "scripts/proxima-listen-gate.sh",
    "scripts/proxima-auth-gate.sh",
    "scripts/proxima-recording-gate.sh",
    "scripts/_floor-crate-matrix.sh",
    ".github/workflows/no-std.yml",
]

# The model stack. `packages` are dependency-closure ROOTS, so every crate that
# owns a cell in proxima-tensor-gate.sh is named directly rather than reached
# through a sibling — see the note in [area.nostd] about a gate that cannot be
# triggered. omega is a root because it depends on proxima-tensor and carries
# the metal_parity cases; the format crates are roots because nothing depends
# on them yet, so a closure walk would never reach them.
[area.tensor]
packages = [
    "proxima-tensor",
    "omega",
    "proxima-gguf",
    "proxima-safetensors",
    "proxima-onnx",
    "proxima-model-interop",
    "proxima-tokenizer",
    "proxima-autograd",
]
paths = [
    "scripts/proxima-tensor-gate.sh",
    "scripts/proxima-tokenizer-gate.sh",
    "scripts/proxima-autograd-gate.sh",
    ".github/workflows/proxima-tensor.yml",
    "proxima-tensor/specs/**",
]

[area.dpdk_stack]
packages = ["proxima-protocols"]
paths = [
    "scripts/dpdk-stack-gate.sh",
    ".github/workflows/dpdk-stack.yml",
]
