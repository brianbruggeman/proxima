[package]
name = "proxima-onnx"
description = "Sans-IO ONNX model parser and Op lowering: hand-rolled protobuf message decode over proxima-protocols' schema-agnostic wire walker, faithful to onnx.proto, plus a NodeProto -> proxima_tensor::Op lowering that composes the existing closed op algebra."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = ["std"]
alloc = []
# runtime config surface ([`config::OnnxParserConfig`]): conflaguration is
# std-only (Settings/env/file), so it rides in only here -- the
# no_std+alloc floor never sees it and always uses `crate::sized` directly.
std = ["alloc", "thiserror/std", "proxima-protocols/std", "dep:bon", "dep:conflaguration", "dep:serde"]
# the sealed mnist f32 inference-lane bench (`benches/mnist_f32_lane.rs`):
# default-off so a normal build/test never needs the real mnist.onnx
# checkout + MNIST idx dataset on disk (the bench itself clean-skips when
# either is absent, but the feature keeps criterion+its transitive deps out
# of a default `cargo build`/`cargo test`).
mnist-f32-bench = ["std"]
# tail-latency + soak bench (`benches/mnist_tail_soak.rs`): same real-fixture
# presence-gating as `mnist-f32-bench` above, kept as its own feature (not
# folded into `mnist-f32-bench`) so a `--features mnist-f32-bench` build
# never pulls in `hdrhistogram` for a plain criterion mean/CI run, and a
# `--features mnist-tail-bench` build never pulls in criterion for the
# phased-tail/soak run.
mnist-tail-bench = ["std"]
# routes the mnist diagnostic example (`examples/mnist_diag.rs`) through
# `proxima-tensor`'s `instrument` counters for an exact (not sampled) MAC
# count and NEON-tile-path breakdown. Kept OFF the `mnist-f32-bench` feature
# above and off the dev-dependency's own feature list: `instrument` adds
# ~30-40% overhead to every `run_reduce`/`run_elementwise` call (measured
# this session, see docs/discipline.md), so the timing bench must never
# build with it -- this is a separate opt-in specifically for the
# non-timed, one-shot diagnostic run.
mnist-diag = ["std", "proxima-tensor/instrument"]
# ROW 217's own repoint (`examples/bge_eval.rs`): reads
# `cpu::width_tile_counters()`/`instrument::reduce_gemm_path_totals()` for
# one untimed corpus pass to prove `width_tile_plan` engagement on the
# sealed harness's own `StaticArena` fast path -- same non-timed-diagnostic
# placement as `mnist-diag` above, since `instrument` overhead must never
# reach the timed measurement loop.
bge-eval-diag = ["std", "proxima-tensor/instrument"]
# ROW 181's own profile-gate probe (`examples/epilogue_profile.rs`):
# per-node-class wall time inside `run_resolved_nodes_in_arena`, bucketed
# by reduce-fold / post-reduce elementwise epilogue / everything else.
# `proxima-tensor/instrument` rides along ONLY for the corroborating
# `path_*` tile-vs-generic counters, same non-timed-diagnostic placement as
# `mnist-diag` above -- never in `mnist-f32-bench`'s feature set.
epilogue-profile-diag = ["std", "proxima-tensor/epilogue-profile-probe", "proxima-tensor/instrument"]
# the tile-pipeline experiment (`benches/tile_pipeline.rs`,
# `benches/support/tile_pipeline.rs`, `tests/tile_pipeline_differential.rs`):
# a line-buffer row-band streaming forward for the real mnist checkpoint,
# built entirely in bench/test space per the disciplined-component
# placement rule (no new type in any library crate). Default-off for the
# same reason `mnist-f32-bench` is: real on-disk fixtures, criterion in the
# dep graph, and this is a measured experiment against the sealed baseline,
# not a production default.
tile-pipeline-bench = ["std"]
# stage-parallelism vs data-parallelism probe (`benches/stage_parallel.rs`):
# 4 pipeline stages on 4 threads connected by `proxima_core::ring::mpsc::Ring`
# (lock-free MPMC used SPSC-style) vs 4 independent single-thread pipelines on
# 4 threads. Bench-only, default-off (compile-time gate, gate 1) -- depends on
# `tile-pipeline-bench`'s own stage types, never a production default.
stage-parallel-bench = ["tile-pipeline-bench"]

[dependencies]
proxima-primitives = { workspace = true, default-features = false }
proxima-protocols = { workspace = true, default-features = false, features = ["protobuf_wire"] }
thiserror.workspace = true
bon = { workspace = true, optional = true }
conflaguration = { workspace = true, features = ["derive", "toml"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
proxima-tensor = { workspace = true, default-features = false, features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
temp-env.workspace = true
proxima-tensor = { features = ["std", "test-support"], path = "../proxima-tensor", default-features = false }
criterion.workspace = true
proxima-core = { path = "../proxima-core", default-features = false, features = ["alloc"] }
hdrhistogram.workspace = true

[[bench]]
name = "mnist_f32_lane"
harness = false
required-features = ["mnist-f32-bench"]

[[bench]]
name = "mnist_tail_soak"
harness = false
required-features = ["mnist-tail-bench"]

[[bench]]
name = "tile_pipeline"
harness = false
required-features = ["tile-pipeline-bench"]

[[bench]]
name = "stage_parallel"
harness = false
required-features = ["stage-parallel-bench"]

[[example]]
name = "generate_op_coverage_doc"

[[example]]
name = "mnist_diag"
required-features = ["mnist-diag"]

[[example]]
name = "bge_accelerate_engagement"
required-features = ["mnist-diag"]

[[example]]
name = "epilogue_profile"
required-features = ["epilogue-profile-diag"]

[[example]]
name = "bge_epilogue_profile"
required-features = ["epilogue-profile-diag"]

[[example]]
name = "bge_epilogue_profile_pack"
required-features = ["epilogue-profile-diag"]

[[example]]
name = "bge_route_census"
required-features = ["epilogue-profile-diag"]
