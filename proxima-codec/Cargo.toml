[package]
name = "proxima-codec"
description = "Pluggable codec registry for proxima — request/response body marshalling with JSON + bytes-passthrough defaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
proxima-core = { workspace = true, default-features = false }
bytes = { workspace = true }
thiserror.workspace = true
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
simd-json = { workspace = true, optional = true }

[features]
default = ["std"]
# Tier-1: no_std + alloc. The FrameCodec/MessageCodec/Datagram traits,
# Addressed, FrameLimits, LengthDelimitedCodec (alloc-free hot path), and
# BytesPassthrough live here. Proven on thumbv7m-none-eabi by the
# `proxima-codec` cell in scripts/_floor-crate-matrix.sh.
alloc = ["proxima-core/alloc"]
# Tier-2: std. Adds JsonCodec (serde + simd-json) and the codec
# registry/factory (proxima-core's FactoryRegistry, serde_json, base64).
# `serde` is std-only on purpose: nothing below this tier deserializes, so a
# bare-metal consumer must not pay for serde + the serde_derive proc-macro.
std = [
    "alloc",
    "proxima-core/std",
    "proxima-core/registry",
    "bytes/std",
    "thiserror/std",
    "dep:base64",
    "dep:serde",
    "serde/std",
    "dep:serde_json",
    "serde_json/std",
    "dep:simd-json",
]

[dev-dependencies]
proxima = { workspace = true, features = ["test-support"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
