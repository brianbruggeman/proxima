[package]
name = "proxima-macros"
description = "Proc-macro support for proxima test fixtures, runtime entrypoints, telemetry spans, schema description, and error derives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = "3"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
# `test-support-tokio` is the narrow forwarder for `#[proxima::test(runtime =
# "tokio")]`'s driver — the span tests await inside the annotated fn, so they
# need a real runtime under them.
proxima = { workspace = true, features = ["test-support-tokio"] }
# so `#[derive(Schema)]`'s emitted `::proxima_config::schema::…` has something
# to resolve against in a doctest — token-shape unit tests alone are what let
# a `::std::…` path ship into an alloc-tier derive.
proxima-config = { workspace = true, features = ["schema"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
trybuild = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "bench_error_derive"
harness = false
