[package]
name = "proxima-mil"
description = "Sans-IO Core ML ML Program writer: the MIL protobuf encoder, weight blob writer and package assembler that omega's door plugs in as its Emit and Package stages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
default = []
alloc = ["dep:proxima-tensor", "proxima-tensor/alloc", "dep:proxima-primitives"]
std = ["alloc", "thiserror/std"]
alloc-count = ["std"]

[dependencies]
half = { version = "2.7.1", default-features = false }
proxima-primitives = { workspace = true, default-features = false, optional = true }
proxima-tensor = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true

[build-dependencies]
proxima-build.workspace = true
thiserror.workspace = true

[dev-dependencies]
proxima-build.workspace = true
proxima-onnx = { path = "../proxima-onnx", version = "0.1.0", features = ["std"] }
temp-env.workspace = true
toml.workspace = true
